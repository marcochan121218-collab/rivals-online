// ===== 傳送：下方按鈕撳一下即飛去商店 =====
function teleportTo(shopKey,btn){
 if(mode!=='lobby'){ showMsg('⚔️ 戰鬥中唔可以傳送！返大廳先得'); return; }
 let shop=SHOPS[shopKey]; if(!shop) return;
 document.querySelectorAll('.bBtn').forEach(b=>b.classList.remove('sel')); if(btn) btn.classList.add('sel');
 player.x=shop.x; player.z=shop.z; player.y=0; player.vy=0; player.onGround=true;
 if(playerGroup){ playerGroup.position.set(player.x,0,player.z); }
 if(shop.yaw!==undefined) yaw=shop.yaw;
 // 傳送特效
 for(let i=0;i<12;i++) makeParticle(player.x,1,player.z,0xfacc15);
 showMsg(`✨ 已傳送去 ${shop.name}！${shop.desc}`);
 // 傳送完自動彈出嗰間店嘅購買單，方便買
 setTimeout(()=>{ openShopPanel(shopKey); },600);
}
// 傳送完彈出嘅購買單
function openShopPanel(shopKey){
 let t=document.getElementById('mTitle'),b=document.getElementById('mBody');document.getElementById('modal').classList.add('show');
 if(shopKey==='weaponShop'){
   t.textContent='🔫 武器商店 - 喺店入面買';
   b.innerHTML=Object.keys(WEAPONS).map(k=>{let w=WEAPONS[k];let owned=S.weapons.includes(k);return `<div class="mBtn"><b>${w.icon} ${w.name}</b> ${w.desc} 傷害 ${w.dmg}<br>價格: ${w.price===0?'免費':w.price+'馬卡龍'} <button onclick="buyWeapon('${k}')" style="float:right;background:#ec4899;color:#fff;border:none;padding:6px 12px;border-radius:99px">${owned?(S.curWeapon===k?'使用中':'使用'):'購買'}</button><br><button onclick="buySkin('${k}')" style="background:#f59e0b;color:#fff;border:none;padding:4px 10px;border-radius:99px;margin-top:4px">買皮膚 30馬卡龍</button></div>`;}).join('');
 } else if(shopKey==='clothShop'){
   t.textContent='👕 服裝商店 - 喺店入面買';
   b.innerHTML=CLOTHES.map((c,i)=>`<div class="mBtn"><b>${c.icon} ${c.name}</b> <span class="tag">${c.type}</span><br>價格: ${c.price}馬卡龍 <button onclick="buyCloth(${i})" style="float:right;background:#ec4899;color:#fff;border:none;padding:6px 12px;border-radius:99px">購買 / 穿上</button></div>`).join('');
 } else if(shopKey==='itemShop'){
   t.textContent='🎒 道具商店';
   b.innerHTML=ITEMS.map((it,i)=>`<div class="mBtn"><b>${it.icon} ${it.name}</b> ${it.desc}<br>價格: ${it.price}馬卡龍 <button onclick="buyItem(${i})" style="float:right;background:#ec4899;color:#fff;border:none;padding:6px 12px;border-radius:99px">購買</button></div>`).join('');
 } else if(shopKey==='boxShop'){
   t.textContent='📦 盲盒商店';
   b.innerHTML=BOXES.map((bx,i)=>`<div class="mBtn"><b>${bx.icon} ${bx.name}</b><br>價格: ${bx.price}${bx.currency==='gem'?'綠寶石':'馬卡龍'} <button onclick="buyBoxShop(${i})" style="float:right;background:#ec4899;color:#fff;border:none;padding:6px 12px;border-radius:99px">購買</button></div>`).join('')+`<p>買完去背包開！背包喺 ⋯ 其他 → 背包</p>`;
 }
}
function buyCloth(i){let c=CLOTHES[i];if(S.mac<c.price)return showMsg('唔夠馬卡龍！');S.mac-=c.price;S.daily.spent+=c.price;if(c.type==='上衣')S.shirt=c.color;if(c.type==='褲')S.pants=c.color;S.skins.push(c.name);save();buildWorld();showMsg(`👕 已買 + 穿上 ${c.name}！`);closeModal();}
function buyItem(i){let it=ITEMS[i];if(S.mac<it.price)return showMsg('唔夠！');S.mac-=it.price;S.daily.spent+=it.price;if(it.key==='heal'||it.key==='fullHeal'||it.key==='speed'||it.key==='def'||it.key==='invincible'){S.items2[it.key].count=(S.items2[it.key].count||0)+1;}else{S.items1[it.key].count=(S.items1[it.key].count||0)+1;}save();showMsg(`🎒 已買 ${it.name}！`);closeModal();}
function buyBoxShop(i){let bx=BOXES[i];if(bx.currency==='gem'){if(S.gem<bx.price)return showMsg('唔夠綠寶石！');S.gem-=bx.price;}else{if(S.mac<bx.price)return showMsg('唔夠馬卡龍！');S.mac-=bx.price;S.daily.spent+=bx.price;}if(bx.key==='big'){S.mac+=100;for(let j=0;j<5;j++)S.inventory.push('武器皮膚盒');S.skins.push('傳說皮膚');showMsg('🎁 大禮包：+100馬卡龍 +5盲盒！');}else if(bx.key==='flower'){S.skins.push('花花裝飾');showMsg('🌸 限定花禮包已買！');}else{S.inventory.push(bx.key);showMsg(`📦 已買 ${bx.name}，去背包開！`);}save();closeModal();}

function clampCamera(pos,limit){pos.x=Math.max(limit.minX,Math.min(limit.maxX,pos.x));pos.z=Math.max(limit.minZ,Math.min(limit.maxZ,pos.z));pos.y=Math.max(limit.minY,Math.min(limit.maxY,pos.y));return pos;}
function blackWallMat(){return new THREE.MeshPhongMaterial({color:0x111827,shininess:10,specular:0x111827,emissive:0x000000});}
function glossyMat(c,s=80){return new THREE.MeshPhongMaterial({color:c,shininess:s,specular:0xffffff,emissive:c,emissiveIntensity:0.08});}
function glossySkin(){return new THREE.MeshPhongMaterial({color:SKIN_COLOR,shininess:120,specular:0xfff7cc,emissive:0xFEF3C7,emissiveIntensity:0.15});}
function makeTextSprite(text,color='#fff',w=512){let c=document.createElement('canvas');c.width=w;c.height=128;let ctx=c.getContext('2d');ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,w,128);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(4,4,w-8,120);ctx.fillStyle=color;ctx.font='bold 44px Arial';ctx.textAlign='center';ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.fillText(text,w/2,82);let tex=new THREE.CanvasTexture(c);let sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sp.scale.set(w/160,0.8,1);return sp;}
function makeDoorSign(text){
 let g=new THREE.Group();let board=new THREE.Mesh(new THREE.BoxGeometry(3.2,0.9,0.15), blackWallMat());board.castShadow=true;g.add(board);
 let border=new THREE.Mesh(new THREE.BoxGeometry(3.3,1,0.05), new THREE.MeshBasicMaterial({color:0xfacc15}));border.position.z=-0.08;g.add(border);
 let label=makeTextSprite(text,'#fde68a',600);label.scale.set(3,0.75,1);label.position.z=0.15;g.add(label);return g;
}
function makeChar(name,shirt,pants,isPlayer){
 let g=new THREE.Group();let skin=glossySkin();let shirtMat=glossyMat(parseInt(shirt.replace('#','0x')),90);let pantsMat=glossyMat(parseInt(pants.replace('#','0x')),90);
 let head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),skin);head.position.y=1.82;head.castShadow=true;g.add(head);
 let neck=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.15,0.35),skin);neck.position.y=1.48;g.add(neck);
 let eyeMat=new THREE.MeshPhongMaterial({color:0x000000,shininess:100,specular:0xffffff});
 let e1=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.02),eyeMat);e1.position.set(-0.12,1.86,0.31);g.add(e1);let e2=e1.clone();e2.position.x=0.12;g.add(e2);
 let body=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.75,0.45),shirtMat);body.position.y=1.05;body.castShadow=true;g.add(body);
 let shoulder=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.18,0.5),shirtMat);shoulder.position.y=1.38;g.add(shoulder);
 function makeArm(side){let p=new THREE.Group();p.position.set(side*0.52,1.38,0);let arm=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.72,0.22),skin);arm.position.y=-0.28;arm.castShadow=true;p.add(arm);let hand=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.15,0.22),skin);hand.position.y=-0.68;p.add(hand);g.add(p);return p;}
 let armL=makeArm(-1),armR=makeArm(1);
 function makeLeg(side){let p=new THREE.Group();p.position.set(side*0.22,0.68,0);let leg=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.68,0.3),pantsMat);leg.position.y=-0.28;leg.castShadow=true;p.add(leg);let shoe=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.12,0.42),skin);shoe.position.set(0,-0.62,0.05);p.add(shoe);g.add(p);return p;}
 let legL=makeLeg(-1),legR=makeLeg(1);
 let hip=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.18,0.42),pantsMat);hip.position.y=0.68;g.add(hip);
 let nameSp=makeTextSprite(name,isPlayer?'#fde68a':'#fff');nameSp.position.y=2.5;g.add(nameSp);
 let gun=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,0.55),new THREE.MeshPhongMaterial({color:0x222222,shininess:150,specular:0xffffff}));gun.position.set(0.52,0.95,0.35);g.add(gun);
 g.userData={armL,armR,legL,legR,walk:0};return g;
}
function animateWalk(g,s){let u=g.userData;u.walk+=s;let s2=Math.sin(u.walk);u.legL.rotation.x=s2*0.7;u.legR.rotation.x=-s2*0.7;u.armL.rotation.x=-s2*0.55;u.armR.rotation.x=s2*0.55;g.position.y=Math.abs(Math.sin(u.walk))*0.04;}
function stopWalk(g){let u=g.userData;u.legL.rotation.x*=0.85;u.legR.rotation.x*=0.85;u.armL.rotation.x*=0.85;u.armR.rotation.x*=0.85;g.position.y*=0.9;}
function makeParticle(x,y,z,color){let p=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.9}));p.position.set(x,y,z);scene.add(p);particles.push({mesh:p,vy:0.05,life:60});}
function make3DWeapon(key){
 let w=WEAPONS[key];let g=new THREE.Group();let mat=new THREE.MeshPhongMaterial({color:w.color,shininess:180,specular:0xffffff,emissive:w.color,emissiveIntensity:0.15});let dark=new THREE.MeshPhongMaterial({color:0x222222,shininess:150,specular:0xffffff});
 if(w.type==='近戰'){
   if(key==='fist'){let f=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),glossySkin());f.castShadow=true;g.add(f);}
   else if(key.includes('macaron')){let m=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.18,20),mat);m.castShadow=true;g.add(m);}
   else{let blade=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.9,0.35),mat);blade.position.y=0.4;blade.castShadow=true;g.add(blade);let handle=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.35,0.12),dark);handle.position.y=-0.2;g.add(handle);}
 } else {
   let body=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.25,1.1),dark);body.castShadow=true;g.add(body);
   let barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.6),mat);barrel.rotation.x=Math.PI/2;barrel.position.set(0,0.05,0.8);g.add(barrel);
   let grip=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.4,0.18),dark);grip.position.set(0,-0.3,-0.3);g.add(grip);
   if(key==='sniper'){let scope=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.4),mat);scope.rotation.x=Math.PI/2;scope.position.set(0,0.25,0);g.add(scope);}
   if(key==='gatling'){for(let i=0;i<3;i++){let b2=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.7),mat);b2.rotation.x=Math.PI/2;b2.position.set(-0.12+i*0.12,0.15,0.8);g.add(b2);}}
 }
 let base=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.08,20),glossyMat(0xffffff,120));base.position.y=-0.6;g.add(base);return g;

function makeFlower(season,flowerData){

function makeWallWithDoor(len,height,doorW,signText){
 let g=new THREE.Group();let side=(len-doorW)/2;let mat=blackWallMat();
 let left=new THREE.Mesh(new THREE.BoxGeometry(side,height,0.5),mat);left.position.x=-doorW/2-side/2;left.position.y=height/2;left.castShadow=true;g.add(left);
 let right=left.clone();right.position.x=doorW/2+side/2;g.add(right);
 let top=new THREE.Mesh(new THREE.BoxGeometry(doorW,height-2.2,0.5),mat);top.position.y=2.2+(height-2.2)/2;g.add(top);
 let frame=new THREE.Mesh(new THREE.BoxGeometry(doorW+0.2,0.15,0.6),new THREE.MeshBasicMaterial({color:0xfacc15}));frame.position.y=2.2;g.add(frame);
 if(signText){let sign=makeDoorSign(signText);sign.position.set(0,3,0.4);g.add(sign);}return g;
}

 renderer.domElement.addEventListener('mousemove',e=>{if(!dragging)return;yaw-=(e.clientX-lx)*0.005;pitch=Math.max(-0.6,Math.min(0.8,pitch-(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;});
 renderer.domElement.addEventListener('mouseup',()=>dragging=false);
 buildWorld();updateWeaponBar();animate();
}
function animate(){
 requestAnimationFrame(animate);
 let speedMult=Date.now()<speedUntil?1.5:1;let speed=0.18*speedMult;
 if(joyX||joyY){
   let forward=-joyY;let right=joyX;let sin=Math.sin(yaw),cos=Math.cos(yaw);
   let dx=(forward*sin + right*cos)*speed;let dz=(forward*cos - right*sin)*speed;
   player.x+=dx;player.z+=dz;let limit=mode==='lobby'?LOBBY:BATTLE;player.x=Math.max(limit.minX,Math.min(limit.maxX,player.x));player.z=Math.max(limit.minZ,Math.min(limit.maxZ,player.z));
   playerGroup.position.set(player.x,player.y||0,player.z);playerGroup.rotation.y=Math.atan2(dx,dz);if(mode==='lobby')animateWalk(playerGroup,0.35);
 } else {if(mode==='lobby')stopWalk(playerGroup);}
 if(!player.onGround){player.vy-=0.02;player.y=(player.y||0)+player.vy;if(player.y<=0){player.y=0;player.onGround=true;}}
 playerGroup.position.y=player.y||0;
 if(mode==='lobby'){
   let camDist=9;let camX=player.x-Math.sin(yaw)*Math.cos(pitch)*camDist;let camZ=player.z-Math.cos(yaw)*Math.cos(pitch)*camDist;let camY=player.y+2.5+Math.sin(pitch)*camDist+1.5;
   let camPos=clampCamera({x:camX,y:camY,z:camZ},LOBBY);let distToPlayer=Math.hypot(camPos.x-player.x,camPos.z-player.z);if(distToPlayer<0.8){camPos.x=player.x;camPos.z=player.z;camPos.y=player.y+3.5;}
   camera.position.set(camPos.x,camPos.y,camPos.z);camera.lookAt(player.x,player.y+1.5,player.z);
 } else {
   camera.position.set(player.x,player.y+1.7,player.z);let lookX=player.x+Math.sin(yaw)*Math.cos(pitch);let lookY=player.y+1.7+Math.sin(pitch);let lookZ=player.z+Math.cos(yaw)*Math.cos(pitch);camera.lookAt(lookX,lookY,lookZ);
 }
 if(mode==='lobby'){
   enemies.forEach(e=>{
     if(e.isPodium) return;
     if(!e.target){ e.target={x:(Math.random()-0.5)*40, z:(Math.random()-0.5)*40}; }
     let dx=e.target.x - e.group.position.x, dz=e.target.z - e.group.position.z;let dist=Math.hypot(dx,dz);
     if(dist < 0.8){ e.wait=(e.wait||0)+1; if(e.wait>30){ e.wait=0; let pts=e.patrol||[{x:0,z:10},{x:18,z:8},{x:-18,z:8},{x:0,z:-18}]; let next=pts[Math.floor(Math.random()*pts.length)]; next={x:Math.max(-26,Math.min(26,next.x)), z:Math.max(-26,Math.min(26,next.z))}; e.target={x:next.x, z:next.z}; } stopWalk(e.group);
     } else { let sp=(e.speed||0.03)*8; e.group.position.x+=dx/dist*sp*0.12; e.group.position.z+=dz/dist*sp*0.12; if(e.group.position.x>26){e.group.position.x=26; e.target={x:0,z:e.group.position.z};} if(e.group.position.x<-26){e.group.position.x=-26; e.target={x:0,z:e.group.position.z};} if(e.group.position.z>26){e.group.position.z=26; e.target={x:e.group.position.x,z:0};} if(e.group.position.z<-26){e.group.position.z=-26; e.target={x:e.group.position.x,z:0};} e.group.rotation.y=Math.atan2(dx,dz); animateWalk(e.group,0.22); }
   });
   let inMode=null;objs.forEach(o=>{if(o.type==='mode'){let d=Math.hypot(player.x-o.pos.x,player.z-o.pos.z);if(d<1.6)inMode=o.name;}});
   if(inMode){inMatchZone+=1/60;if(inMatchZone>0.5&&inMatchZone<0.6)showMsg(`⚔️ 揀咗 ${inMode}，企 2 秒配對...`);if(inMatchZone>=2){inMatchZone=0;selectedMode=inMode;toggleMode();}}else inMatchZone=0;
   // 行近商店貨架會顯示價錢 + 撳買
   objs.forEach(o=>{
     let d=Math.hypot(player.x-o.pos.x,player.z-o.pos.z);
     if(d<1.0 && Math.random()<0.02){
       if(o.type==='weapon') showMsg(`🔫 ${WEAPONS[o.key].name} - ${WEAPONS[o.key].price===0?'免費':WEAPONS[o.key].price+'馬卡龍'} 傷害 ${WEAPONS[o.key].dmg} | 撳下方「武器商店」買`);
       if(o.type==='cloth') showMsg(`👕 ${CLOTHES[o.index].name} - ${CLOTHES[o.index].price}馬卡龍 | 撳下方「服裝商店」買`);
       if(o.type==='item') showMsg(`🎒 ${ITEMS[o.index].name} - ${ITEMS[o.index].price}馬卡龍`);
       if(o.type==='box') showMsg(`📦 ${BOXES[o.index].name} - ${BOXES[o.index].price}${BOXES[o.index].currency==='gem'?'綠寶石':'馬卡龍'}`);
     }
   });
 } else {
   battleTime+=1/60;document.getElementById('hTime').textContent=Math.max(0,Math.floor(120-battleTime))+'s';
   flowers.forEach(f=>{
     let d=Math.hypot(player.x-f.x,player.z-f.z);
     if(d<1.2 && Date.now()-f.lastTrigger>5000){
       f.lastTrigger=Date.now();let name=f.data.name;
       if(name==='復活節百合'){ player.hp=Math.min(100,player.hp+10); document.getElementById('hHp').textContent=player.hp; showMsg('🤍 百合：回血 +10hp！'); for(let i=0;i<6;i++)makeParticle(player.x,1.5,player.z,0xffffff); }
       else if(name==='鬱金香'){ speedUntil=Date.now()+5000; showMsg('🌷 鬱金香：加速 5秒！'); }
       else if(name==='水仙花'){ S.mac+=5; save(); showMsg('🌼 水仙花：+5馬卡龍幣！'); }
       else if(name==='風信子'){ showMsg('🪻 風信子：呢度係認路標記！'); }
       else if(name==='雛菊'){ showMsg('🌼 雛菊：花瓣爆開！'); for(let i=0;i<8;i++)makeParticle(f.x,1,f.z,0xfbcfe8); }
       else if(name==='黑玫瑰'){ showMsg('🥀 黑玫瑰：隱身！'); }
       else if(name==='萬壽菊'){ showMsg('🌼 萬壽菊：鬼火燒敵人！'); enemies.forEach(e=>{ if(e.hp>0 && Math.hypot(e.group.position.x-f.x,e.group.position.z-f.z)<3){ e.hp-=10; } }); }
       else if(name==='曼陀羅'){ showMsg('🌸 曼陀羅：毒霧！'); for(let i=0;i<10;i++)makeParticle(f.x,1,f.z,0x9333ea); }
       else if(name==='糖果花'){ player.hp=Math.min(100,player.hp+10); document.getElementById('hHp').textContent=player.hp; showMsg('🍬 糖果花：回血 +10hp！'); }
       else if(name==='朱古力花'){ showMsg('🍫 朱古力花：附近傷害+10% 5秒'); }
       else if(name==='棉花糖花'){ player.vy=0.35; player.onGround=false; showMsg('☁️ 棉花糖花：彈高！'); }
       document.getElementById('hFlower').textContent=f.data.icon+' '+name;
     }
   });
   enemies.forEach(e=>{if(e.hp<=0)return;let dx=player.x-e.group.position.x,dz=player.z-e.group.position.z;let dist=Math.hypot(dx,dz);if(dist>2.5){e.group.position.x+=dx/dist*e.speed*3;e.group.position.z+=dz/dist*e.speed*3;e.group.rotation.y=Math.atan2(dx,dz);animateWalk(e.group,0.25);}else stopWalk(e.group);
     if(dist<10&&Date.now()-e.lastShot>1800){e.lastShot=Date.now();let dmg=e.skill==='新手'?5:e.skill==='普通'?10:e.skill==='高手'?15:20;if(Date.now()<invincibleUntil)dmg=0;if(Date.now()<defUntil)dmg=Math.floor(dmg/2);if(dmg>0){player.hp-=dmg;document.getElementById('hHp').textContent=Math.max(0,player.hp);showMsg(`💥 ${e.botName}(${e.skill}) 打中你 -${dmg}`);}if(player.hp<=0)endBattle(false);}});
   if(battleTime>=120||enemies.every(e=>e.hp<=0))endBattle(enemies.every(e=>e.hp<=0));
 }
 bullets.forEach(b=>{b.mesh.position.x+=b.vx;b.mesh.position.z+=b.vz;enemies.forEach(e=>{if(e.hp>0&&Math.hypot(b.mesh.position.x-e.group.position.x,b.mesh.position.z-e.group.position.z)<1){let w=WEAPONS[S.curWeapon];let dmg=w.dmg;let isHead=Math.random()<0.2;if(isHead){dmg*=2;S.headshot++;}e.hp-=dmg;S.totalDmg+=dmg;b.mesh.position.y=-10;for(let i=0;i<6;i++)makeParticle(e.group.position.x,1.5,e.group.position.z,0xef4444);if(e.hp<=0){battleKills++;document.getElementById('hKill').textContent=battleKills;e.group.position.y=-10;showMsg(`🎯 擊殺！${e.botName}(${e.skill})`);}}});});
 particles.forEach(p=>{p.mesh.position.y+=p.vy;p.life--;p.mesh.material.opacity=p.life/60;if(p.life<=0)scene.remove(p.mesh);});particles=particles.filter(p=>p.life>0);
 renderer.render(scene,camera);
}
function toggleMode(){if(mode==='lobby'){mode='battle';mapIdx=Math.floor(Math.random()*MAPS.length);player={x:-8,z:-8,hp:100,vy:0,onGround:true,y:0};battleTime=0;battleKills=0;document.getElementById('hKill').textContent='0';document.getElementById('hHp').textContent='100';buildWorld();showMsg(`⚔️ 開始！${selectedMode} - 地圖：${MAPS[mapIdx].name} 🌸 花都生咗！`);}else{mode='lobby';player={x:0,z:8,hp:100,vy:0,onGround:true,y:0};buildWorld();showMsg('🏠 返到大屋');}}
function shoot(){let w=WEAPONS[S.curWeapon];if(mode!=='battle')return showMsg('🎯 大廳唔可以射，去配對大廳開波！');if(w.type==='近戰'){let nearest=null,nd=999;enemies.forEach(e=>{let d=Math.hypot(e.group.position.x-player.x,e.group.position.z-player.z);if(d<nd){nd=d;nearest=e;}});if(nearest&&nd<2){let dmg=w.dmg;if(w.name==='刺客刀')dmg=Math.max(1,Math.round(10-nd*2));if(w.name==='偷血刀'){player.hp=Math.min(100,player.hp+5);document.getElementById('hHp').textContent=player.hp;}if(w.name==='馬卡龍刀'){player.hp=Math.min(100,player.hp+1);document.getElementById('hHp').textContent=player.hp;}nearest.hp-=dmg;S.totalDmg+=dmg;S.daily.dmg+=dmg;if(nearest.hp<=0){battleKills++;nearest.group.position.y=-10;showMsg('⚔️ 近戰擊殺！');}}else showMsg('太遠！');return;}
 let dir=new THREE.Vector3(0,0,1);dir.applyQuaternion(camera.quaternion);let bMesh=new THREE.Mesh(new THREE.SphereGeometry(0.16,10,10),new THREE.MeshPhongMaterial({color:w.color||0xfacc15,shininess:200,specular:0xffffff,emissive:w.color||0xfacc15,emissiveIntensity:0.5}));bMesh.position.set(player.x,player.y+1.6,player.z);scene.add(bMesh);bullets.push({mesh:bMesh,vx:dir.x*0.6,vz:dir.z*0.6});if(flashLight){flashLight.position.set(player.x,player.y+1.8,player.z);flashLight.intensity=1.2;setTimeout(()=>flashLight.intensity=0,100);}}
function useGrenade(){if(mode!=='battle')return showMsg('要去戰鬥先用到！');if(!S.items1.grenade.count)return showMsg('手榴彈用晒！');S.items1.grenade.count--;save();let nearest=enemies.find(e=>e.hp>0);if(nearest){nearest.hp-=30;S.totalDmg+=30;for(let i=0;i<10;i++)makeParticle(nearest.group.position.x,1.5,nearest.group.position.z,0xf59e0b);showMsg(`💣 手榴彈命中 ${nearest.botName} -30hp！`);if(nearest.hp<=0){battleKills++;nearest.group.position.y=-10;}}updateUI();}
function useHeal(){if(mode!=='battle')return showMsg('要去戰鬥先用到！');if(S.items2.heal.count>0){S.items2.heal.count--;player.hp=Math.min(100,player.hp+30);document.getElementById('hHp').textContent=player.hp;showMsg('❤️ 醫療包 +30hp');}else if(S.items2.fullHeal.count>0){S.items2.fullHeal.count--;player.hp=100;document.getElementById('hHp').textContent=100;showMsg('❤️ 滿血包！');}else if(S.items2.speed.count>0){S.items2.speed.count--;speedUntil=Date.now()+10000;showMsg('⚡ 速度包！');}else if(S.items2.def.count>0){S.items2.def.count--;defUntil=Date.now()+10000;showMsg('🛡️ 防禦包！');}else if(S.items2.invincible.count>0){S.items2.invincible.count--;invincibleUntil=Date.now()+5000;showMsg('✨ 無敵包！');}else showMsg('道具用晒！');save();updateUI();}
function jump(){if(player.onGround){player.vy=0.28;player.onGround=false;}}
function endBattle(win){if(mode!=='battle')return;S.battles++;S.daily.battles++;if(win){S.win++;S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);let expGain=50+battleKills*10;let macGain=20+battleKills*10;S.exp+=expGain;S.mac+=macGain;if(S.exp>=100){S.level++;S.exp-=100;}showMsg(`🏆 ${selectedMode} 勝利！+${expGain}經驗 +${macGain}馬卡龍`);}else{S.lose++;S.streak=0;S.exp+=10;showMsg('💀 落敗 +10經驗');}save();mode='lobby';player={x:0,z:8,hp:100,vy:0,onGround:true,y:0};buildWorld();}
