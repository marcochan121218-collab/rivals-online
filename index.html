<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Macaroon Fight - 你的 Rivals</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;overflow:hidden}
body{background:#000;font-family:Arial,sans-serif;color:white}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.bar{background:rgba(0,0,0,.6);padding:8px 14px;border-radius:10px;border:1px solid #333}
#hpBar{width:160px;height:14px;background:#333;border-radius:99px;overflow:hidden;margin-top:5px}
#hpFill{width:100%;height:100%;background:#2ecc71;transition:width .2s}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;z-index:10;pointer-events:none;text-shadow:0 0 5px #000}
#center{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:20;background:rgba(0,0,0,.85);padding:24px;border-radius:16px;width:90%;max-width:360px}
#center h1{font-size:28px;color:#f1c40f}
#center p{margin:10px 0;color:#ccc;font-size:14px;line-height:1.6}
button{background:#f1c40f;border:none;padding:14px 22px;border-radius:99px;font-weight:900;font-size:16px;width:100%;margin-top:10px}
#controls{position:fixed;bottom:16px;left:0;right:0;display:none;justify-content:space-between;padding:0 14px;z-index:20}
#joy{width:110px;height:110px;background:rgba(255,255,255,.15);border-radius:50%;border:2px solid rgba(255,255,255,.4);position:relative}
#knob{width:48px;height:48px;background:white;border-radius:50%;position:absolute;left:31px;top:31px}
.btn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);color:white;font-size:22px;display:flex;align-items:center;justify-content:center}
#shoot{width:80px;height:80px;background:#e74c3c;border-color:white;font-size:28px}
#hit{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);color:#ff4757;font-size:32px;font-weight:900;display:none;z-index:15;text-shadow:0 0 10px #000}
#kill{position:fixed;top:15%;left:50%;transform:translateX(-50%);background:#f1c40f;color:#000;padding:8px 16px;border-radius:99px;font-weight:900;display:none;z-index:15}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<div class="bar">❤️ 血量<div id="hpBar"><div id="hpFill"></div></div></div>
<div class="bar">🏆 擊殺: <span id="kills">0</span> | 死亡: <span id="deaths">0</span></div>
<div class="bar">🔫 子彈: <span id="ammo">30</span></div>
</div>
<div id="cross">+</div>
<div id="hit">HIT -25</div>
<div id="kill">🎉 擊殺敵人 +1 !</div>
<div id="center">
<h1>🍩 MACAROON FIGHT</h1>
<p>你的原創射擊遊戲<br>手機用左邊搖桿移動<br>滑動右邊轉視角<br>點紅色按鈕射擊</p>
<button onclick="startGame()">開始遊戲 ▶</button>
<p style="font-size:12px">電腦: WASD 移動 / 滑鼠瞄準 / 點擊射擊 / 空白鍵跳</p>
</div>
<div id="controls">
<div id="joy"><div id="knob"></div></div>
<div style="display:flex;gap:10px;align-items:flex-end">
<div class="btn" id="jumpBtn">⬆️</div>
<div class="btn" id="shoot">🔫</div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,player={hp:100,kills:0,deaths:0,ammo:30,x:0,z:8,vy:0,ground:true},enemies=[],bullets=[],keys={},yaw=0,pitch=0,joyX=0,joyY=0,started=false;
function startGame(){
document.getElementById('center').style.display='none';
document.getElementById('controls').style.display='flex';
started=true;
init();
if(document.documentElement.requestPointerLock && window.innerWidth>700) document.body.requestPointerLock();
}
function init(){
scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb); scene.fog=new THREE.Fog(0x87ceeb,20,90);
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,200);
renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.getElementById('game').appendChild(renderer.domElement);
let light=new THREE.AmbientLight(0xffffff,0.9); scene.add(light);
let sun=new THREE.DirectionalLight(0xffffff,0.6); sun.position.set(10,20,10); scene.add(sun);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshLambertMaterial({color:0x555555})); ground.rotation.x=-Math.PI/2; scene.add(ground);
// 城市建築
for(let i=0;i<18;i++){
let h=Math.random()*10+4; let b=new THREE.Mesh(new THREE.BoxGeometry(6,h,6), new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(Math.random(),0.5,0.5)}));
b.position.set((Math.random()-0.5)*80, h/2, (Math.random()-0.5)*80); scene.add(b);
}
// 敵人
for(let i=0;i<4;i++) spawnEnemy();
animate();
}
function spawnEnemy(){
let g=new THREE.Group();
let body=new THREE.Mesh(new THREE.BoxGeometry(1,1.8,0.6), new THREE.MeshLambertMaterial({color:0xe74c3c}));
body.position.y=1; g.add(body);
let head=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.7,0.7), new THREE.MeshLambertMaterial({color:0xffd8a8}));
head.position.y=2.2; g.add(head);
let x=(Math.random()-0.5)*60, z=(Math.random()-0.5)*60;
g.position.set(x,0,z); scene.add(g);
enemies.push({g,hp:100,x,z});
}
function shoot(){
if(player.ammo<=0){player.ammo=30; document.getElementById('ammo').textContent=player.ammo; return;}
player.ammo--; document.getElementById('ammo').textContent=player.ammo;
let dir=new THREE.Vector3(0,0,-1); dir.applyEuler(camera.rotation);
let b=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8), new THREE.MeshBasicMaterial({color:0xffff00}));
b.position.copy(camera.position); scene.add(b); bullets.push({m:b,dir});
}
function animate(){
requestAnimationFrame(animate);
if(!started) return;
let speed=0.14;
let f=0,r=0;
if(keys['w']||keys['W']||keys['ArrowUp']) f=1; if(keys['s']||keys['S']||keys['ArrowDown']) f=-1;
if(keys['a']||keys['A']||keys['ArrowLeft']) r=-1; if(keys['d']||keys['D']||keys['ArrowRight']) r=1;
f+= -joyY; r+= joyX;
player.x += (Math.sin(yaw)*f + Math.cos(yaw)*r)*speed;
player.z += (-Math.cos(yaw)*f + Math.sin(yaw)*r)*speed;
player.x=Math.max(-45,Math.min(45,player.x)); player.z=Math.max(-45,Math.min(45,player.z));
if(keys[' ' ] && player.ground){player.vy=0.28; player.ground=false;}
player.vy-=0.015; let y=(camera.position.y||1.7)+player.vy; if(y<=1.7){y=1.7; player.vy=0; player.ground=true;}
camera.position.set(player.x,y,player.z); camera.rotation.set(pitch,yaw,0,'YXZ');
// 敵人移動 + 攻擊
enemies.forEach(e=>{
let dx=player.x-e.x, dz=player.z-e.z; let d=Math.sqrt(dx*dx+dz*dz);
if(d>1.5){e.x+=dx/d*0.04; e.z+=dz/d*0.04; e.g.position.set(e.x,0,e.z); e.g.lookAt(player.x,0,player.z);}
if(d<2 && Math.random()<0.01){player.hp-=8; updateHP();}
if(e.hp<=0){scene.remove(e.g); e.hp=100; e.x=(Math.random()-0.5)*60; e.z=(Math.random()-0.5)*60; e.g.position.set(e.x,0,e.z); scene.add(e.g); player.kills++; document.getElementById('kills').textContent=player.kills; showKill();}
});
// 子彈
bullets.forEach((b,idx)=>{
b.m.position.add(b.dir.clone().multiplyScalar(0.8));
enemies.forEach(e=>{ if(b.m.position.distanceTo(e.g.position.clone().add(new THREE.Vector3(0,1,0)))<1.2){ e.hp-=25; showHit(); scene.remove(b.m); bullets.splice(idx,1);} });
if(b.m.position.length()>80){scene.remove(b.m); bullets.splice(idx,1);}
});
if(player.hp<=0){player.deaths++; document.getElementById('deaths').textContent=player.deaths; player.hp=100; player.x=0; player.z=8; updateHP();}
renderer.render(scene,camera);
}
function updateHP(){document.getElementById('hpFill').style.width=player.hp+'%'; document.getElementById('hpFill').style.background=player.hp>50?'#2ecc71':player.hp>25?'#f1c40f':'#e74c3c';}
function showHit(){let h=document.getElementById('hit'); h.style.display='block'; setTimeout(()=>h.style.display='none',300);}
function showKill(){let k=document.getElementById('kill'); k.style.display='block'; setTimeout(()=>k.style.display='none',1500);}
document.addEventListener('keydown',e=>keys[e.key]=true); document.addEventListener('keyup',e=>keys[e.key]=false);
document.addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*0.003; pitch-=e.movementY*0.003; pitch=Math.max(-1,Math.min(1,pitch));}});
document.addEventListener('click',()=>{if(started && window.innerWidth>700) shoot();});
// 手機控制
let joy=document.getElementById('joy'),knob=document.getElementById('knob');
joy.addEventListener('touchmove',e=>{let t=e.touches[0]; let r=joy.getBoundingClientRect(); joyX=(t.clientX-(r.left+55))/55; joyY=(t.clientY-(r.top+55))/55; knob.style.left=(31+joyX*25)+'px'; knob.style.top=(31+joyY*25)+'px'; e.preventDefault();},{passive:false});
joy.addEventListener('touchend',()=>{joyX=0;joyY=0;knob.style.left='31px';knob.style.top='31px';});
document.getElementById('shoot').addEventListener('touchstart',e=>{shoot(); e.preventDefault();});
document.getElementById('jumpBtn').addEventListener('touchstart',e=>{if(player.ground){player.vy=0.28; player.ground=false;} e.preventDefault();});
let lastX=0,lastY=0;
document.addEventListener('touchmove',e=>{if(e.target.closest('#joy')||e.target.closest('#controls')) return; let t=e.touches[0]; if(lastX){yaw-=(t.clientX-lastX)*0.005; pitch-=(t.clientY-lastY)*0.005;} lastX=t.clientX; lastY=t.clientY;},{passive:true});
document.addEventListener('touchend',()=>{lastX=0;lastY=0;});
</script>
</body>
</html>
