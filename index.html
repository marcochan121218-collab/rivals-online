function init3D(){let view=document.getElementById('view');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(70,view.clientWidth/view.clientHeight,0.1,200);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(view.clientWidth,view.clientHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;view.appendChild(renderer.domElement);
 let dragging=false,lx=0,ly=0;
 renderer.domElement.addEventListener('touchstart',e=>{dragging=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;});
 renderer.domElement.addEventListener('touchmove',e=>{if(!dragging)return;let t=e.touches[0];yaw-=(t.clientX-lx)*0.005;pitch=Math.max(-0.6,Math.min(0.8,pitch-(t.clientY-ly)*0.005));lx=t.clientX;ly=t.clientY;e.preventDefault();},{passive:false});
 renderer.domElement.addEventListener('touchend',()=>dragging=false);
 renderer.domElement.addEventListener('mousedown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
 renderer.domElement.addEventListener('mousemove',e=>{if(!dragging)return;yaw-=(e.clientX-lx)*0.005;pitch=Math.max(-0.6,Math.min(0.8,pitch-(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;});

 buildWorld();updateWeaponBar();animate();}
function animate(){requestAnimationFrame(animate);
 let speedMult=Date.now()<speedUntil?1.5:1;let speed=0.12*speedMult;let moveX=joyX,moveY=joyY;
 if(moveX||moveY){let sin=Math.sin(yaw),cos=Math.cos(yaw);let dx=(moveX*cos-moveY*sin)*speed,dz=(moveX*sin+moveY*cos)*speed;player.x+=dx;player.z+=dz;let limit=mode==='lobby'?4.5:9.5;player.x=Math.max(-limit,Math.min(limit,player.x));player.z=Math.max(-limit,Math.min(limit,player.z));playerGroup.position.set(player.x,player.y||0,player.z);playerGroup.rotation.y=Math.atan2(dx,dz);if(mode==='lobby')animateWalk(playerGroup,0.35);}else{if(mode==='lobby')stopWalk(playerGroup);}
 if(!player.onGround){player.vy-=0.02;player.y=(player.y||0)+player.vy;if(player.y<=0){player.y=0;player.onGround=true;}}
 playerGroup.position.y=player.y||0;

function showStats(){let t=document.getElementById('mTitle'),b=document.getElementById('mBody');t.textContent='📊 數據';b.innerHTML=`<div class="row"><span>戰鬥場數</span><b>${S.battles}</b></div><div class="row"><span>勝利場數</span><b>${S.win}</b></div><div class="row"><span>落敗場數</span><b>${S.lose}</b></div><div class="row"><span>勝率</span><b>${S.battles?Math.round(S.win/S.battles*100):0}%</b></div><div class="row"><span>連勝</span><b>${S.streak} (最高 ${S.maxStreak})</b></div><div class="row"><span>爆頭率</span><b>${S.battles?Math.round(S.headshot/Math.max(1,S.kills)*100):0}%</b></div><div class="row"><span>總傷害</span><b>${S.totalDmg}</b></div>`;}
function showAch(){let t=document.getElementById('mTitle'),b=document.getElementById('mBody');t.textContent='🏅 成就 - 10項，完成變第2級，如此類推';let achs=[['首勝','贏 1 場',S.win,1],['百戰','玩 100 場',S.battles,100],['連勝王','連勝 5 場',S.maxStreak,5],['爆頭王','爆頭 50 次',S.headshot,50],['傷害王','總傷害 50000',S.totalDmg,50000],['收藏家','擁有 10 個皮膚',S.skins.length,10],['富翁','擁有 1000 馬卡龍幣',S.mac,1000],['大師','等級 20',S.level,20],['狙擊手','狙擊槍擊殺 20 人',0,20],['馬卡龍大師','用馬卡龍槍擊殺 100 人',0,100]];b.innerHTML=achs.map((a,i)=>{let lv=S.ach[i]||1;let target=a[3]*lv;return `<div class="mBtn"><b>${a[0]} Lv.${lv} ✨</b> - ${a[1]} x${lv}<br>進度: ${a[2]}/${target} ${a[2]>=target?`<button onclick="claimAch(${i})" style="background:#22c55e;color:#fff;border:none;padding:4px 10px;border-radius:99px">領獎 升到 Lv.${lv+1}</button>`:''}<br><span style="font-size:11px;color:#888">每一級任務相同，難度和數量會提升</span></div>`;}).join('');}
function claimAch(i){let lv=S.ach[i]||1;S.ach[i]=lv+1;S.mac+=50;S.exp+=50;save();showMsg(`🏅 成就升級到 Lv.${lv+1}！+50馬卡龍 +50經驗`);closeModal();}
function showUpdates(){let t=document.getElementById('mTitle'),b=document.getElementById('mBody');t.textContent='🔄 更新';b.innerHTML=`<p>📢 <b>最新更新 v3.0 最終版：</b><br>✨ 大廳 10x10x5 + 出身點<br>✨ 機械人名稱 Chocolate/winner/Player/Roblox/小號/我很強/我很弱+數字，唔重複<br>✨ 馬卡龍刀改做 傷害1 CD0.2 回1hp<br>✨ 特別道具1+2 全部加入<br>✨ 光澤 + 無縫擺動</p><p>🎁 更新獎勵：+50馬卡龍</p><button class="bigBtn" onclick="claimUpdate()">領取更新獎勵</button>`;}
function claimUpdate(){S.mac+=50;save();showMsg('🎁 已領更新獎勵 +50馬卡龍');closeModal();}
function showFriends(){let t=document.getElementById('mTitle'),b=document.getElementById('mBody');t.textContent='👥 好友 - 通過排行榜邀請 (在選擇中)';b.innerHTML=`<p>好友：${S.friends.length?S.friends.join(', '):'暫時冇好友'}</p><input id="friendName" placeholder="輸入排行榜對方名字" style="width:100%;padding:12px;border-radius:12px;border:2px solid #fde68a"><button class="bigBtn" onclick="addFriend()">📩 發好友邀請</button><p style="font-size:12px;color:#888">對方上線同意就成為好友，可以組隊玩多於一人遊戲。排行榜冇機械人，唔可以向機械人發邀請！</p><button class="mBtn" onclick="openGift()">🎁 贈送系統 (在其他中)</button>`;}
function addFriend(){let n=document.getElementById('friendName').value.trim();if(!n)return showMsg('請輸入名字！');if(['阿強','小美','大佬明','馬卡龍女王','狙擊手Jack'].includes(n)){if(!S.friends.includes(n))S.friends.push(n);save();showMsg(`✅ ${n} 同意咗！已成為好友，可以組隊！`);}else{showMsg(`❌ 系統通知：${n} 不同意 / 唔係真人，唔可以加！`);}closeModal();}
function showRank(){let t=document.getElementById('mTitle'),b=document.getElementById('mBody');t.textContent='🏆 排行榜 - 只顯示所有真人，冇機械人';let real=[{name:'阿強',level:32,streak:12},{name:'小美',level:28,streak:8},{name:'大佬明',level:25,streak:15},{name:'馬卡龍女王',level:22,streak:6},{name:'狙擊手Jack',level:20,streak:4},{name:S.name,level:S.level,streak:S.streak,me:true}];let levelRank=[...real].sort((a,b)=>b.level-a.level);let streakRank=[...real].sort((a,b)=>b.streak-a.streak);b.innerHTML=`<b>等級排行榜 (勝利獎勵)</b>`+levelRank.map((p,i)=>`<div class="row"><span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1+'.'} ${p.name} ${p.me?'(你)':''}</span><b>Lv.${p.level}</b></div>`).join('')+`<br><b>連勝排行榜 (勝利獎勵)</b>`+streakRank.map((p,i)=>`<div class="row"><span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1+'.'} ${p.name}</span><b>${p.streak}連勝</b></div>`).join('')+`<p style="font-size:12px">排行榜沒有機械人 🤖❌</p>`;}
let joy=document.getElementById('joy'),knob=document.getElementById('joyKnob');
joy.addEventListener('touchstart',e=>{handleJoy(e.touches[0]);});
joy.addEventListener('touchmove',e=>{handleJoy(e.touches[0]);e.preventDefault();},{passive:false});
joy.addEventListener('touchend',()=>{joyX=0;joyY=0;knob.style.left='29px';knob.style.top='29px';});
function handleJoy(t){let r=joy.getBoundingClientRect();let x=(t.clientX-r.left-52)/52,y=(t.clientY-r.top-52)/52;joyX=Math.max(-1,Math.min(1,x));joyY=Math.max(-1,Math.min(1,y));knob.style.left=(29+joyX*20)+'px';knob.style.top=(29+joyY*20)+'px';}
addEventListener('resize',()=>{if(renderer){let v=document.getElementById('view');renderer.setSize(v.clientWidth,v.clientHeight);camera.aspect=v.clientWidth/v.clientHeight;camera.updateProjectionMatrix();}});
if(ACC&&ACC.auto&&S){setTimeout(()=>doLogin(),300);}
</script></body></html>
