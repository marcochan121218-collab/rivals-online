let S=JSON.parse(localStorage.getItem('peak_big')||'null');let ACC=JSON.parse(localStorage.getItem('peak_big_acc')||'null');
if(ACC&&ACC.auto){document.getElementById('inName').value=ACC.name;document.getElementById('inPass').value=ACC.pass;}
function doLogin(){let n=document.getElementById('inName').value.trim()||'玩家',p=document.getElementById('inPass').value.trim()||'123';if(ACC&&ACC.name!==n){if(!confirm('換名字開新存檔？'))return;S=null;}if(!S){S={name:n,pass:p,level:1,exp:0,gem:5,mac:80,win:0,lose:0,battles:0,streak:0,maxStreak:0,headshot:0,totalDmg:0,kills:0,inventory:[],weapons:['pistol','fist'],skins:[],killFx:[],shirt:'#3b82f6',pants:'#f97316',curWeapon:'pistol',loginDay:1,lastLogin:'',missCount:0,loginStreak:0,friends:[],ach:{},items1:{grenade:{count:2},smoke:{count:3},fireBomb:{count:1},freezeBomb:{count:2},poison:{count:1}},items2:{heal:{count:3},fullHeal:{count:1},speed:{count:2},def:{count:2},invincible:{count:1}},daily:{battles:0,dmg:0,spent:0},dailyTarget:{battle:3,dmg:3000}};}
 ACC={name:n,pass:p,auto:document.getElementById('autoLogin').checked};localStorage.setItem('peak_big_acc',JSON.stringify(ACC));let today=new Date().toDateString();if(S.lastLogin!==today){S.lastLogin=today;S.loginDay=(S.loginDay%7)+1;let rewards=[{mac:3,gem:0},{mac:5,gem:0},{mac:10,gem:0},{mac:3,gem:1},{mac:5,gem:0},{mac:10,gem:0},{mac:20,gem:3}];let r=rewards[(S.loginDay-1)%7];S.mac+=r.mac;S.gem+=r.gem;S.daily={battles:0,dmg:0,spent:0};S.dailyTarget={battle:1+Math.floor(Math.random()*10),dmg:Math.round((1000+Math.random()*9000)/100)*100};setTimeout(()=>showMsg(`🎁 Day${S.loginDay}: +${r.mac}馬卡龍 +${r.gem}綠寶石`),600);}
 save();document.getElementById('login').style.display='none';document.getElementById('game').style.display='flex';init3D();}

function makeTextSprite(text,color='#fff',w=512){let c=document.createElement('canvas');c.width=w;c.height=128;let ctx=c.getContext('2d');ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,w,128);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(4,4,w-8,120);ctx.fillStyle=color;ctx.font='bold 44px Arial';ctx.textAlign='center';ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.fillText(text,w/2,82);let tex=new THREE.CanvasTexture(c);let sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sp.scale.set(w/160,0.8,1);return sp;}
function makeChar(name,shirt,pants,isPlayer){
 let g=new THREE.Group();let skin=glossySkin();let shirtMat=glossyMat(parseInt(shirt.replace('#','0x')),90);let pantsMat=glossyMat(parseInt(pants.replace('#','0x')),90);

function animate(){
 requestAnimationFrame(animate);
 let speedMult=Date.now()<speedUntil?1.5:1;let speed=0.14*speedMult;
 if(joyX||joyY){let sin=Math.sin(yaw),cos=Math.cos(yaw);let dx=(joyX*cos-joyY*sin)*speed,dz=(joyX*sin+joyY*cos)*speed;player.x+=dx;player.z+=dz;let limit=mode==='lobby'?LOBBY:BATTLE;player.x=Math.max(limit.minX,Math.min(limit.maxX,player.x));player.z=Math.max(limit.minZ,Math.min(limit.maxZ,player.z));playerGroup.position.set(player.x,player.y||0,player.z);playerGroup.rotation.y=Math.atan2(dx,dz);if(mode==='lobby')animateWalk(playerGroup,0.35);}else{if(mode==='lobby')stopWalk(playerGroup);}
 if(!player.onGround){player.vy-=0.02;player.y=(player.y||0)+player.vy;if(player.y<=0){player.y=0;player.onGround=true;}}
 playerGroup.position.y=player.y||0;
 if(mode==='lobby'){
   // ===== 第三視覺防穿：相機 Clamp，唔穿地板 / 天花板 / 牆 =====
   let camDist=5;let camX=player.x-Math.sin(yaw)*Math.cos(pitch)*camDist;let camZ=player.z-Math.cos(yaw)*Math.cos(pitch)*camDist;let camY=player.y+2+Math.sin(pitch)*camDist+1.5;
   let camPos=clampCamera({x:camX,y:camY,z:camZ},LOBBY);
   // 如果撞牆，拉近距離，唔好穿過去
   let distToPlayer=Math.hypot(camPos.x-player.x,camPos.z-player.z);
   if(distToPlayer<0.8){camPos.x=player.x;camPos.z=player.z;camPos.y=player.y+3;}
   camera.position.set(camPos.x,camPos.y,camPos.z);camera.lookAt(player.x,player.y+1.5,player.z);
 } else {
   camera.position.set(player.x,player.y+1.7,player.z);
   let lookX=player.x+Math.sin(yaw)*Math.cos(pitch);let lookY=player.y+1.7+Math.sin(pitch);let lookZ=player.z+Math.cos(yaw)*Math.cos(pitch);camera.lookAt(lookX,lookY,lookZ);
 }

function toggleMode(){if(mode==='lobby'){mode='battle';mapIdx=Math.floor(Math.random()*MAPS.length);player={x:-8,z:-8,hp:100,vy:0,onGround:true,y:0};battleTime=0;battleKills=0;document.getElementById('hKill').textContent='0';document.getElementById('hHp').textContent='100';buildWorld();showMsg(`⚔️ 開始！${selectedMode} - 地圖：${MAPS[mapIdx].name}，每人出身點唔同！`);}else{mode='lobby';player={x:0,z:12,hp:100,vy:0,onGround:true,y:0};buildWorld();showMsg('🏠 返到大廳');}}
function shoot(){let w=WEAPONS[S.curWeapon];if(mode!=='battle')return showMsg('🎯 大廳唔可以射，去測試場試武器，去配對大廳開波！');if(w.type==='近戰'){let nearest=null,nd=999;enemies.forEach(e=>{let d=Math.hypot(e.group.position.x-player.x,e.group.position.z-player.z);if(d<nd){nd=d;nearest=e;}});if(nearest&&nd<2){let dmg=w.dmg;if(w.name==='刺客刀')dmg=Math.max(1,Math.round(10-nd*2));if(w.name==='偷血刀'){player.hp=Math.min(100,player.hp+5);document.getElementById('hHp').textContent=player.hp;}if(w.name==='馬卡龍刀'){player.hp=Math.min(100,player.hp+1);document.getElementById('hHp').textContent=player.hp;}nearest.hp-=dmg;S.totalDmg+=dmg;S.daily.dmg+=dmg;if(nearest.hp<=0){battleKills++;nearest.group.position.y=-10;showMsg('⚔️ 近戰擊殺！');}}else showMsg('太遠！');return;}
 let dir=new THREE.Vector3(0,0,1);dir.applyQuaternion(camera.quaternion);let bMesh=new THREE.Mesh(new THREE.SphereGeometry(0.16,10,10),new THREE.MeshPhongMaterial({color:w.color||0xfacc15,shininess:200,specular:0xffffff,emissive:w.color||0xfacc15,emissiveIntensity:0.5}));bMesh.position.set(player.x,player.y+1.6,player.z);scene.add(bMesh);bullets.push({mesh:bMesh,vx:dir.x*0.6,vz:dir.z*0.6});if(flashLight){flashLight.position.set(player.x,player.y+1.8,player.z);flashLight.intensity=1.2;setTimeout(()=>flashLight.intensity=0,100);}}
function useGrenade(){if(mode!=='battle')return showMsg('要去戰鬥先用到！');if(!S.items1.grenade.count)return showMsg('手榴彈用晒！');S.items1.grenade.count--;save();let nearest=enemies.find(e=>e.hp>0);if(nearest){nearest.hp-=30;S.totalDmg+=30;for(let i=0;i<10;i++)makeParticle(nearest.group.position.x,1.5,nearest.group.position.z,0xf59e0b);showMsg(`💣 手榴彈命中 ${nearest.botName} -30hp！`);if(nearest.hp<=0){battleKills++;nearest.group.position.y=-10;}}updateUI();}
function useHeal(){if(mode!=='battle')return showMsg('要去戰鬥先用到！');if(S.items2.heal.count>0){S.items2.heal.count--;player.hp=Math.min(100,player.hp+30);document.getElementById('hHp').textContent=player.hp;showMsg('❤️ 醫療包 +30hp');}else if(S.items2.fullHeal.count>0){S.items2.fullHeal.count--;player.hp=100;document.getElementById('hHp').textContent=100;showMsg('❤️ 滿血包！');}else if(S.items2.speed.count>0){S.items2.speed.count--;speedUntil=Date.now()+10000;showMsg('⚡ 速度包！');}else if(S.items2.def.count>0){S.items2.def.count--;defUntil=Date.now()+10000;showMsg('🛡️ 防禦包！');}else if(S.items2.invincible.count>0){S.items2.invincible.count--;invincibleUntil=Date.now()+5000;showMsg('✨ 無敵包！');}else showMsg('道具用晒！');save();updateUI();}

 if(type==='char'){t.textContent='🟨 角色';b.innerHTML=`<div style="text-align:center"><div style="width:90px;height:90px;margin:0 auto;background:linear-gradient(145deg,#fef3c7,#facc15);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px">🟨</div><p>淺黃色膚質，頭、身、腳正方形，無縫<br>上衣 ${S.shirt} | 褲 ${S.pants}</p></div>`+['#3b82f6','#ef4444','#22c55e','#facc15','#ec4899','#8b5cf6','#06b6d4','#f97316'].map(c=>`<button class="mBtn" onclick="changeShirt('${c}')">👕 上衣 ${c} (20馬卡龍)</button>`).join('')+['#f97316','#3b82f6','#22c55e','#000000','#ec4899','#8b5cf6'].map(c=>`<button class="mBtn" onclick="changePants('${c}')">👖 褲 ${c} (20馬卡龍)</button>`).join('');}
 if(type==='shop'){t.textContent='🛒 商店';b.innerHTML=`<div class="mBtn"><b>📦 武器皮膚盒 (隨機)</b> 30馬卡龍<br><button onclick="buyBox('weaponBox')" style="background:#ec4899;color:#fff;border:none;padding:7px 14px;border-radius:99px">買</button></div><div class="mBtn"><b>📦 武器皮膚盒 (史詩以上)</b> 5綠寶石<br><button onclick="buyBox('epicBox')" style="background:#ec4899;color:#fff;border:none;padding:7px 14px;border-radius:99px">買</button></div><div class="mBtn"><b>📦 角色裝扮 (隨機)</b> 30馬卡龍<br><button onclick="buyBox('charBox')" style="background:#ec4899;color:#fff;border:none;padding:7px 14px;border-radius:99px">買</button></div><div class="mBtn"><b>📦 擊殺特效盒 (隨機)</b> 40馬卡龍<br><button onclick="buyBox('killBox')" style="background:#ec4899;color:#fff;border:none;padding:7px 14px;border-radius:99px">買</button></div><div class="mBtn"><b>🎁 大禮包</b> 10綠寶石：5盲盒+100馬卡龍+傳說皮膚<br><button onclick="buyBig()" style="background:#f59e0b;color:#fff;border:none;padding:7px 14px;border-radius:99px">買</button></div><div class="mBtn"><b>🎫 通行證</b> 20綠寶石：每日+50馬卡龍<br><button onclick="buyPass()" style="background:#8b5cf6;color:#fff;border:none;padding:7px 14px;border-radius:99px">買</button></div>`;}

let joy=document.getElementById('joy'),knob=document.getElementById('joyKnob');
joy.addEventListener('touchstart',e=>{handleJoy(e.touches[0]);});

function handleJoy(t){let r=joy.getBoundingClientRect();let x=(t.clientX-r.left-52)/52,y=(t.clientY-r.top-52)/52;joyX=Math.max(-1,Math.min(1,x));joyY=Math.max(-1,Math.min(1,y));knob.style.left=(29+joyX*20)+'px';knob.style.top=(29+joyY*20)+'px';}
