function resize(){ let r=document.getElementById('mapWrap').getBoundingClientRect(); cv.width=r.width; cv.height=r.height; }
addEventListener('resize',()=>{ if(document.getElementById('game').style.display==='flex') resize(); });
function updateUI(){ document.getElementById('rStamina').textContent=S.stamina; document.getElementById('rGold').textContent=S.gold; document.getElementById('rMat').textContent=S.mat; document.getElementById('rFactory').textContent=S.level; document.getElementById('idleInfo').textContent=`+${5+S.level*2}/分`; document.getElementById('rLand').textContent=S.land; document.getElementById('pName').textContent=S.name; document.getElementById('pName2').textContent=S.name; document.getElementById('pLv').textContent='Lv.'+S.level; document.getElementById('pLand').textContent=S.land+' 格'; document.getElementById('pKills').textContent=S.kills; document.getElementById('pGold').textContent=S.gold; document.getElementById('pMat').textContent=S.mat; document.getElementById('pFactory').textContent='Lv.'+S.level; }
function draw(){
  if(document.getElementById('game').style.display!=='flex') return;
  let W=cv.width,H=cv.height; ctx.fillStyle='#0EA5E9'; ctx.fillRect(0,0,W,H);
  let cols=Math.ceil(W/scale)+2, rows=Math.ceil(H/scale)+2; let startX=Math.floor(camX-W/2/scale), startY=Math.floor(camY-H/2/scale);
  for(let gx=startX;gx<startX+cols;gx++) for(let gy=startY;gy<startY+rows;gy++){
    if(gx<0||gy<0||gx>=1000||gy>=1000) continue; let sx=(gx-startX)*scale + (camX*scale%scale) - scale; let sy=(gy-startY)*scale + (camY*scale%scale) - scale; // 簡化定位
    sx=(gx-camX)*scale+W/2; sy=(gy-camY)*scale+H/2;
    let type=isLand(gx,gy);
    if(type==='me'){ ctx.fillStyle='#58CC5A'; ctx.fillRect(sx,sy,scale-1,scale-1); ctx.fillStyle='#2ecc71'; ctx.fillRect(sx,sy,scale-1,3); // 立體高光
      if(gx===S.baseX&&gy===S.baseY){ ctx.fillStyle='#f1c40f'; ctx.fillRect(sx-2,sy-2,scale+3,scale+3); ctx.fillStyle='#000'; ctx.font='bold 12px Arial'; ctx.textAlign='center'; ctx.fillText('🏰',sx+scale/2,sy+scale-4); }
    } else if(type==='bot'){ let b=botClaimed(gx,gy); ctx.fillStyle=b.color; ctx.fillRect(sx,sy,scale-1,scale-1); ctx.fillStyle='#fff5'; ctx.fillRect(sx,sy,scale-1,3); if(gx===b.x&&gy===b.y){ ctx.fillStyle='#fff'; ctx.fillRect(sx-2,sy-2,scale+3,scale+3); ctx.fillStyle='#000'; ctx.font='bold 12px Arial'; ctx.textAlign='center'; ctx.fillText('🤖',sx+scale/2,sy+scale-4); }
    } else { ctx.fillStyle='#0EA5E9'; ctx.fillRect(sx,sy,scale-1,scale-1); ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(sx,sy,scale-1,2); if((gx+gy)%7===0){ ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(sx+scale/2,sy+scale/2,2,0,7); ctx.fill(); } }
  }
  // 你的頭像在中心
  let cx=W/2,cy=H/2; ctx.fillStyle='#FF69B4'; ctx.beginPath(); ctx.arc(cx,cy,14,0,7); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='18px Arial'; ctx.textAlign='center'; ctx.fillText('🍩',cx,cy+6);
  // 小地圖
  mctx.fillStyle='#0EA5E9'; mctx.fillRect(0,0,90,90); bots.forEach(b=>{ mctx.fillStyle=b.color; mctx.fillRect(b.x/1000*90-3,b.y/1000*90-3,6,6); }); mctx.fillStyle='#58CC5A'; mctx.fillRect(S.baseX/1000*90-4,S.baseY/1000*90-4,8,8); mctx.strokeStyle='#fff'; mctx.strokeRect(camX/1000*90-8,camY/1000*90-8,16,16);
  requestAnimationFrame(draw);
}
// 拖動地圖
cv.addEventListener('touchstart',e=>{dragging=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;});
cv.addEventListener('touchmove',e=>{if(!dragging)return;let t=e.touches[0];camX-=(t.clientX-lx)/scale;camY-=(t.clientY-ly)/scale;camX=Math.max(10,Math.min(990,camX));camY=Math.max(10,Math.min(990,camY));lx=t.clientX;ly=t.clientY;e.preventDefault();},{passive:false});
cv.addEventListener('touchend',()=>dragging=false);
cv.addEventListener('click',e=>{ let r=cv.getBoundingClientRect(); let gx=Math.round(camX+(e.clientX-r.left-r.width/2)/scale); let gy=Math.round(camY+(e.clientY-r.top-r.height/2)/scale); tryClaim(gx,gy); });
function centerMap(){ camX=S.baseX; camY=S.baseY; showMsg('📍 已回到主堡！'); }
function toggleProfile(){ document.getElementById('profile').classList.toggle('show'); }
function upgradeFactory(){ if(S.gold<200) return alert('金幣不夠！需要 200 金幣'); S.gold-=200; S.level++; save(); showMsg('🏭 工廠升級到 Lv.'+S.level+'！賺錢更快了！'); }
function showHelp(){ alert('玩法：\n1. 拖動地圖查看世界\n2. 點一下海洋，會出題目，答對就可以填海 +1 格\n3. 只能填自己領地旁邊的海\n4. 點 ⚔️ 攻擊機械人，贏了搶領地，輸了會死，要重新復活！\n5. 工廠會自動賺錢，就算關掉遊戲也會！'); }
// ==================== 填海 + 題目 ====================
let curQ=null,curTarget=null;
function tryClaim(gx,gy){
  if(isLand(gx,gy)==='me') return showMsg('這已經是你的領地了！');
  if(isLand(gx,gy)==='bot') return showMsg('這是機械人的領地！用 ⚔️ 攻擊他！');
  // 檢查是否在自己領地旁邊
  let near=false; for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) if(S.claimed[(gx+dx)+','+(gy+dy)]) near=true;
  if(!near) return showMsg('只能填自己領地旁邊的海！先回主堡附近！');
  if(S.stamina<5) return showMsg('體力不足！等工廠回復！');
  curTarget={x:gx,y:gy}; curQ=QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];
  document.getElementById('qText').textContent=curQ[0];
  let opts=[curQ[1],curQ[2],curQ[3],curQ[4]]; let html=''; opts.forEach((o,i)=>{ html+=`<button class="qBtn" onclick="answerQ(${i})">${['A','B','C','D'][i]}. ${o}</button>`; }); document.getElementById('qOpts').innerHTML=html; document.getElementById('quiz').classList.add('show');
}
function doQuizRandom(){ // 直接在主堡旁邊找一個海來填
  let found=null; for(let r=1;r<10&&!found;r++) for(let dx=-r;dx<=r;dx++) for(let dy=-r;dy<=r;dy++){ let x=S.baseX+dx,y=S.baseY+dy; if(isLand(x,y)==='sea' && S.claimed[(x+1)+','+y]||S.claimed[(x-1)+','+y]||S.claimed[x+','+(y+1)]||S.claimed[x+','+(y-1)]) { found={x,y}; break; } }
  if(!found) { for(let dx=-6;dx<=6;dx++) for(let dy=-6;dy<=6;dy++){ let x=S.baseX+dx,y=S.baseY+dy; if(isLand(x,y)==='sea'){ found={x,y}; break; } } }
  if(found) tryClaim(found.x,found.y); else showMsg('附近沒有海了！');
}
function answerQ(i){
  document.getElementById('quiz').classList.remove('show');
  if(i===curQ[5]){ S.claimed[curTarget.x+','+curTarget.y]='me'; S.land++; S.gold=Math.min(1000,S.gold+50); S.mat=Math.min(500,S.mat+20); S.stamina=Math.min(100,S.stamina+10); if(S.land%20===0){ S.level++; showMsg('🎉 領地升級！Lv.'+S.level+'！工廠更快了！'); } save(); showMsg('✅ 答對！填海成功 +1 格！+50金幣 +20建材！'); }
  else { S.stamina=Math.max(0,S.stamina-5); save(); showMsg('❌ 答錯了！正確答案是: '+curQ[1+curQ[5]]+'，扣 5 體力'); }
}
// ==================== 戰鬥 ====================
function attackBot(){
  let nearBot=null; bots.forEach(b=>{ if(Math.hypot(b.x-S.baseX,b.y-S.baseY)<40) nearBot=b; });
  if(!nearBot){ showMsg('機械人太遠了！拖動地圖去角落找他們！'); return; }
  if(!confirm(`要攻擊 ${nearBot.name} 嗎？他有 ${nearBot.land} 格領地！\n贏了搶 10 格，輸了你會死，要清零復活！`)) return;
  let myPower=S.land + Math.random()*50; let botPower=nearBot.land + Math.random()*50;
  if(myPower>botPower){ S.kills++; nearBot.land-=10; S.land+=10; for(let i=0;i<10;i++){ let x=nearBot.x+Math.floor(Math.random()*9)-4, y=nearBot.y+Math.floor(Math.random()*9)-4; S.claimed[x+','+y]='me'; } S.gold=Math.min(1000,S.gold+200); save(); showMsg(`🎉 勝利！打敗 ${nearBot.name}！搶了 10 格 +200金幣！`); }
  else { // 死亡清零復活
    alert(`💀 你被 ${nearBot.name} 打敗了！\n你的領地清零，要在世界其他地方重新復活！`);
    S.claimed={}; S.land=81; let nx=200+Math.floor(Math.random()*600), ny=200+Math.floor(Math.random()*600); S.baseX=nx; S.baseY=ny; for(let dx=-4;dx<=4;dx++) for(let dy=-4;dy<=4;dy++) S.claimed[(nx+dx)+','+(ny+dy)]='me'; S.gold=Math.floor(S.gold/2); S.mat=Math.floor(S.mat/2); save(); camX=nx; camY=ny; showMsg('🔄 已在新地方復活！加油！');
  }
}
// 如果已經自動登入
if(ACC && ACC.auto && S){ document.getElementById('inName').value=ACC.name; document.getElementById('inPass').value=ACC.pass; setTimeout(()=>doLogin(),300); }
</script></body></html>
