<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>巔峰對決 - 馬卡龍 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:Arial;overflow:hidden}
#login{position:fixed;inset:0;background:linear-gradient(180deg,#facc15,#f472b6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:300}
.loginBox{background:#fff;color:#222;width:100%;max-width:380px;border-radius:20px;padding:22px;text-align:center}
input{width:100%;padding:12px;border-radius:12px;border:2px solid #eee;margin:6px 0;font-size:15px}
.loginBtn{width:100%;background:#ec4899;color:#fff;border:none;padding:13px;border-radius:99px;font-weight:900;font-size:16px;margin-top:8px}
#game{display:none;flex-direction:column;height:100vh;height:100dvh}
.top{display:flex;gap:6px;padding:7px;background:#111827;align-items:center;flex-shrink:0}
.avatar{width:50px;height:50px;border-radius:8px;background:#facc15;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #fff;flex-shrink:0}
.res{flex:1;background:#1f2937;border-radius:10px;padding:5px 7px;font-size:11px;line-height:1.5;border:1px solid #374151;white-space:nowrap;overflow:hidden}
.res b{color:#facc15}
#view{flex:1;position:relative;overflow:hidden;background:#87ceeb}
#view canvas{display:block}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;z-index:20;pointer-events:none}
.hudBox{background:#000a;color:#fff;padding:6px 10px;border-radius:99px;font-size:12px}
#centerDot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:#fff;border:1px solid #000;z-index:20}
#joy{position:absolute;left:14px;bottom:90px;width:100px;height:100px;border-radius:50%;background:#0003;border:2px solid #fff5;z-index:20}
#joyKnob{position:absolute;width:44px;height:44px;border-radius:50%;background:#fff;left:28px;top:28px}
#fireBtn{position:absolute;right:14px;bottom:110px;width:72px;height:72px;border-radius:50%;background:#ef4444;color:#fff;font-size:24px;border:3px solid #fff;z-index:20}
#jumpBtn{position:absolute;right:92px;bottom:90px;width:52px;height:52px;border-radius:50%;background:#3b82f6;color:#fff;border:2px solid #fff;z-index:20}
#switchBtn{position:absolute;right:14px;top:50px;background:#111827;color:#fff;padding:8px 12px;border-radius:99px;font-size:12px;z-index:20;border:1px solid #fff}
#weaponBar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:20}
.wBtn{background:#111827;color:#fff;border:1px solid #fff;padding:8px 10px;border-radius:10px;font-size:12px}
.wBtn.sel{background:#ec4899}
.bottom{display:flex;gap:6px;padding:8px;background:#111827;flex-shrink:0}
.bBtn{flex:1;background:#374151;color:#fff;border:none;padding:12px 2px;border-radius:12px;font-size:12px}
.bBtn.sel{background:#ec4899}
#msg{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:200;display:none;white-space:nowrap;max-width:92%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:250;display:none;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.modal.show{display:flex}.mBox{background:#fff;color:#222;width:100%;max-width:440px;border-radius:20px;padding:18px;max-height:90vh;overflow-y:auto}
.mBtn{width:100%;background:#f1f5f9;border:2px solid #e2e8f0;padding:11px;border-radius:12px;margin:5px 0;text-align:left;font-size:14px}
.mBtn.sel{border-color:#ec4899;background:#fdf2f8}
.bigBtn{width:100%;background:#ec4899;color:#fff;border:none;padding:12px;border-radius:99px;font-weight:900;margin-top:8px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
button{cursor:pointer}
</style></head><body>
<div id="login"><div class="loginBox"><div style="font-size:50px">⚔️🍩</div><h1>巔峰對決 - 馬卡龍</h1><p style="color:#666;font-size:13px"><b>3D 第三人稱</b><br>鏡頭跟住你跑 • 睇到自己角色 • 頭頂有你個名<br>唔係平面圖，係立體世界！</p><input id="inName" placeholder="玩家名字，會顯示喺頭頂"><input id="inPass" type="password" placeholder="密碼"><label style="font-size:13px"><input type="checkbox" id="autoLogin" checked> 自動登入</label><button class="loginBtn" onclick="doLogin()">🔥 進入 3D 大廳</button><button onclick="clearSave()" style="background:none;border:none;color:#999;font-size:12px;margin-top:8px">清除存檔</button></div></div>
<div id="game">
<div class="top"><div class="avatar">🟨</div><div class="res">🟢 <b id="rGem">5</b> 綠寶石<br>🍩 <b id="rMac">50</b> 馬卡龍幣</div><div class="res">⭐ Lv.<b id="rLv">1</b> <span id="rExp">0/100</span><br>🏆 <b id="rRank">第3名</b> | 🔥 <b id="rStreak">0</b>連勝</div><div class="res">⚔️ <b id="rWin">0</b>勝 / <b id="rLose">0</b>敗<br>🗺️ <span id="rMap">大廳</span></div></div>
<div id="view"><div id="hud"><div class="hudBox">❤️ <span id="hHp">100</span></div><div class="hudBox">🔫 <span id="hWeapon">手槍</span> <span id="hAmmo">15</span></div><div class="hudBox">🗺️ <span id="hMap2">大廳</span></div><div class="hudBox">⚔️ <span id="hKill">0</span>殺</div><div class="hudBox">⏱️ <span id="hTime">-</span></div></div><div id="centerDot"></div><button id="switchBtn" onclick="toggleMode()">🔄 去戰鬥 / 返大廳</button><div id="joy"><div id="joyKnob"></div></div><button id="fireBtn" onclick="shoot()">🔫</button><button id="jumpBtn" onclick="jump()">🦘</button><div id="weaponBar"></div><div style="position:absolute;top:46px;left:50%;transform:translateX(-50%);background:#000a;padding:6px 12px;border-radius:99px;font-size:11px;z-index:20">👈 左邊搖桿跑 | 👉 拖動右邊畫面轉鏡頭睇四周 | 行去粉紅圈 3秒開波</div></div>
<div class="bottom"><button class="bBtn sel" onclick="tabBottom('bag',this)">🎒 背包</button><button class="bBtn" onclick="tabBottom('weapon',this)">🔫 武器</button><button class="bBtn" onclick="tabBottom('char',this)">🟨 角色</button><button class="bBtn" onclick="tabBottom('shop',this)">🛒 商店</button><button class="bBtn" onclick="tabBottom('other',this)">⋯ 其他</button></div>
</div>
<div class="modal" id="modal"><div class="mBox"><div style="display:flex;justify-content:space-between"><h3 id="mTitle">標題</h3><span onclick="closeModal()" style="font-size:22px">✕</span></div><div id="mBody"></div></div></div>
<div id="msg"></div>
<script>
let WEAPONS={
 pistol:{name:'手槍',type:'遠程',ammo:15,cd:0.5,dmg:12,price:0,icon:'🔫'},
 rifle:{name:'步槍',type:'遠程',ammo:20,cd:0.2,dmg:10,price:50,icon:'🔫'},
 shotgun:{name:'散彈槍',type:'遠程',ammo:2,cd:3,dmg:40,price:100,icon:'💥'},
 sniper:{name:'狙擊槍',type:'遠程',ammo:3,cd:5,dmg:80,price:150,icon:'🎯'},
 gatling:{name:'加特林',type:'遠程',ammo:100,cd:20,dmg:8,price:300,icon:'🔥'},
 freeze:{name:'急凍槍',type:'遠程',ammo:8,cd:2,dmg:15,price:120,icon:'❄️'},
 firegun:{name:'燃燒槍',type:'遠程',ammo:5,cd:2,dmg:20,price:120,icon:'🔥'},
 teleport:{name:'傳送步槍',type:'遠程',ammo:10,cd:1,dmg:18,price:200,icon:'🌀'},
 infinite:{name:'無限彈藥槍',type:'遠程',ammo:9999,cd:0.5,dmg:8,price:500,icon:'♾️'},
 macaronGun:{name:'馬卡龍神槍',type:'遠程',ammo:30,cd:0.2,dmg:25,price:400,icon:'🍩'},
 fist:{name:'拳頭',type:'近戰',ammo:9999,cd:0.5,dmg:3,price:0,icon:'👊'},
 knife:{name:'小刀',type:'近戰',ammo:9999,cd:0.5,dmg:5,price:20,icon:'🔪'},
 cleaver:{name:'菜刀',type:'近戰',ammo:9999,cd:1,dmg:8,price:40,icon:'🔪'},
 assassin:{name:'刺客刀',type:'近戰',ammo:9999,cd:0.8,dmg:10,price:80,icon:'🗡️'},
 steal:{name:'偷血刀',type:'近戰',ammo:9999,cd:0.5,dmg:3,price:80,icon:'🩸'},
 macaronKnife:{name:'馬卡龍刀',type:'近戰',ammo:9999,cd:0.6,dmg:15,price:150,icon:'🍩'},
};
let MAPS=[
 {name:'森林🌳',floor:0x22c55e,obj:'tree',desc:'綠色地板，樹'},
 {name:'沙漠🌵',floor:0xfde68a,obj:'cactus',desc:'淺黃色，仙人掌'},
 {name:'雪地❄️',floor:0xbae6fd,obj:'snowtree',desc:'淺藍色，雪樹'},
 {name:'城市🌆',floor:0xd1d5db,obj:'building',desc:'淺灰色，大廈'},
 {name:'戰場⚔️',floor:0xd6b48f,obj:'ruin',desc:'淺棕色，損壞建築'},
 {name:'美食😋',floor:0xfbcfe8,obj:'cake',desc:'粉紅色，甜品'},
 {name:'馬卡龍🤩',floor:0xfacc15,obj:'macaron',desc:'黃色，超多馬卡龍'},
];
let S=JSON.parse(localStorage.getItem('peak3d')||'null');
let ACC=JSON.parse(localStorage.getItem('peak3d_acc')||'null');
if(ACC&&ACC.auto){document.getElementById('inName').value=ACC.name;document.getElementById('inPass').value=ACC.pass;}
function doLogin(){let n=document.getElementById('inName').value.trim()||'玩家',p=document.getElementById('inPass').value.trim()||'123';if(ACC&&ACC.name!==n){if(!confirm('換名字開新存檔？'))return;S=null;}if(!S){S={name:n,pass:p,level:1,exp:0,gem:5,mac:50,win:0,lose:0,battles:0,streak:0,maxStreak:0,headshot:0,totalDmg:0,kills:0,inventory:[],weapons:['pistol','fist'],skins:[],shirt:'#3b82f6',pants:'#f97316',curWeapon:'pistol',loginDay:1,lastLogin:''};}
 ACC={name:n,pass:p,auto:document.getElementById('autoLogin').checked};localStorage.setItem('peak3d_acc',JSON.stringify(ACC));
 let today=new Date().toDateString();if(S.lastLogin!==today){S.lastLogin=today;let r=[{mac:3,gem:0},{mac:5,gem:0},{mac:10,gem:0},{mac:3,gem:1},{mac:5,gem:0},{mac:10,gem:0},{mac:20,gem:3}][(S.loginDay-1)%7];S.mac+=r.mac;S.gem+=r.gem;S.loginDay++;setTimeout(()=>showMsg(`🎁 每日登入 Day${S.loginDay-1}: +${r.mac}馬卡龍 +${r.gem}綠寶石`),600);}
 save();document.getElementById('login').style.display='none';document.getElementById('game').style.display='flex';init3D();}
function clearSave(){localStorage.removeItem('peak3d');localStorage.removeItem('peak3d_acc');location.reload();}
function logout(){save();document.getElementById('game').style.display='none';document.getElementById('login').style.display='flex';}
function save(){localStorage.setItem('peak3d',JSON.stringify(S));updateUI();}
function showMsg(t){let m=document.getElementById('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',4500);}
function updateUI(){document.getElementById('rGem').textContent=S.gem;document.getElementById('rMac').textContent=S.mac;document.getElementById('rLv').textContent=S.level;document.getElementById('rExp').textContent=S.exp+'/100';document.getElementById('rWin').textContent=S.win;document.getElementById('rLose').textContent=S.lose;document.getElementById('rStreak').textContent=S.streak;}
function closeModal(){document.getElementById('modal').classList.remove('show');}
// ===== 3D 第三人稱 =====
let scene,camera,renderer,playerGroup,playerNameSprite,player={x:0,z:8,hp:100,vy:0,onGround:true},enemies=[],bullets=[],objs=[],mode='lobby',mapIdx=0,battleTime=0,battleKills=0,yaw=0,pitch=0.2,joyX=0,joyY=0,inCircle=0;
function makeTextSprite(text,color='#fff'){let c=document.createElement('canvas');c.width=256;c.height=64;let ctx=c.getContext('2d');ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,256,64);ctx.fillStyle=color;ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText(text,128,42);let tex=new THREE.CanvasTexture(c);let mat=new THREE.SpriteMaterial({map:tex,transparent:true});let sp=new THREE.Sprite(mat);sp.scale.set(3,0.75,1);return sp;}
function makeChar(name,shirt,pants,isPlayer){
 let g=new THREE.Group();
 let skin=new THREE.MeshLambertMaterial({color:0xfacc15});
 let shirtMat=new THREE.MeshLambertMaterial({color:parseInt(shirt.replace('#','0x'))});
 let pantsMat=new THREE.MeshLambertMaterial({color:parseInt(pants.replace('#','0x'))});
 let head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),skin);head.position.y=1.7;g.add(head);
 let eyeMat=new THREE.MeshBasicMaterial({color:0x000000});
 let e1=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.02),eyeMat);e1.position.set(-0.12,1.75,0.31);g.add(e1);
 let e2=e1.clone();e2.position.x=0.12;g.add(e2);
 let body=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.7,0.4),shirtMat);body.position.y=1.05;g.add(body);
 let legL=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.6,0.3),pantsMat);legL.position.set(-0.2,0.3,0);legL.name='legL';g.add(legL);
 let legR=legL.clone();legR.position.x=0.2;legR.name='legR';g.add(legR);
 let armL=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.6,0.2),skin);armL.position.set(-0.55,1.05,0);armL.name='armL';g.add(armL);
 let armR=armL.clone();armR.position.x=0.55;armR.name='armR';g.add(armR);
 let nameSp=makeTextSprite(name,isPlayer?'#facc15':'#fff');nameSp.position.y=2.3;g.add(nameSp);
 // 武器喺手
 let gun=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,0.5),new THREE.MeshLambertMaterial({color:0x222222}));gun.position.set(0.55,0.9,0.3);gun.name='gun';g.add(gun);
 g.userData={legL,legR,armL,armR,walk:0};
 return g;
}
function clearScene(){while(scene.children.length>0){scene.remove(scene.children[0]);}}
function buildWorld(){
 clearScene();enemies=[];bullets=[];objs=[];
 let map=MAPS[mapIdx];
 scene.background=new THREE.Color(0x87ceeb);
 let light=new THREE.AmbientLight(0xffffff,0.9);scene.add(light);
 let dir=new THREE.DirectionalLight(0xffffff,0.6);dir.position.set(10,20,10);scene.add(dir);
 // 地板 20x20x20 概念：20x20 大小
 let floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshLambertMaterial({color:map.floor}));floor.rotation.x=-Math.PI/2;scene.add(floor);
 // 邊界牆
 let wallMat=new THREE.MeshLambertMaterial({color:0x888888});
 for(let i=0;i<4;i++){let w=new THREE.Mesh(new THREE.BoxGeometry(40,2,0.5),wallMat);if(i===0)w.position.set(0,1,-20);if(i===1)w.position.set(0,1,20);if(i===2){w.rotation.y=Math.PI/2;w.position.set(-20,1,0);}if(i===3){w.rotation.y=Math.PI/2;w.position.set(20,1,0);}scene.add(w);}
 if(mode==='lobby'){
   // 大廳：大圓形黃色中間出生點
   let circle=new THREE.Mesh(new THREE.CylinderGeometry(5,5,0.1,32),new THREE.MeshLambertMaterial({color:0xfacc15}));circle.position.set(0,0.05,10);scene.add(circle);
   // 走廊
   let corr=new THREE.Mesh(new THREE.BoxGeometry(3,0.1,12),new THREE.MeshLambertMaterial({color:0xfef3c7}));corr.position.set(0,0.05,2);scene.add(corr);
   // 選擇大廳小圓形 - 粉紅色，企3秒開始
   let start=new THREE.Mesh(new THREE.CylinderGeometry(2,2,0.15,32),new THREE.MeshLambertMaterial({color:0xec4899}));start.position.set(0,0.08,-6);start.name='startCircle';scene.add(start);objs.push(start);
   // 左邊排行榜牌
   let rankBoard=new THREE.Mesh(new THREE.BoxGeometry(4,3,0.3),new THREE.MeshLambertMaterial({color:0x111827}));rankBoard.position.set(-10,1.5,-6);scene.add(rankBoard);let rs=makeTextSprite('🏆 排行榜 真人', '#fff');rs.position.set(-10,1.5,-5.5);scene.add(rs);
   // 右邊測試場
   let test=new THREE.Mesh(new THREE.BoxGeometry(4,3,0.3),new THREE.MeshLambertMaterial({color:0x3b82f6}));test.position.set(10,1.5,-6);scene.add(test);let ts=makeTextSprite('🎯 測試場', '#fff');ts.position.set(10,1.5,-5.5);scene.add(ts);
   // 10-15個機械人喺大廳行嚟行去，衫唔同
   let shirts=['#ef4444','#22c55e','#8b5cf6','#f59e0b','#ec4899','#06b6d4'];let pants=['#f97316','#3b82f6','#000000'];
   for(let i=0;i<12;i++){let b=makeChar('Bot'+(i+1),shirts[i%6],pants[i%3],false);b.position.set(-8+Math.random()*16,0,-4+Math.random()*12);scene.add(b);enemies.push({group:b,hp:100,skill:'大廳',speed:0.02,dir:Math.random()*Math.PI*2});}
   document.getElementById('rMap').textContent='大廳';document.getElementById('hMap2').textContent='大廳';
 } else {
   // 戰鬥地圖：按地圖類型起立體物件
   for(let i=0;i<18;i++){let x=-18+Math.random()*36,z=-18+Math.random()*36;if(Math.abs(x)<3&&Math.abs(z)<3)continue;let o=null;
     if(map.obj==='tree'){o=new THREE.Group();let trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,2),new THREE.MeshLambertMaterial({color:0x92400e}));trunk.position.y=1;o.add(trunk);let leaf=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),new THREE.MeshLambertMaterial({color:0x22c55e}));leaf.position.y=3;o.add(leaf);}
     else if(map.obj==='cactus'){o=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1+Math.random()*2),new THREE.MeshLambertMaterial({color:0x22c55e}));o.position.y=1;}
     else if(map.obj==='snowtree'){o=new THREE.Mesh(new THREE.BoxGeometry(1.5,3,1.5),new THREE.MeshLambertMaterial({color:0xffffff}));o.position.y=1.5;}
     else if(map.obj==='building'){o=new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*2,4+Math.random()*4,2),new THREE.MeshLambertMaterial({color:0x9ca3af}));o.position.y=3;}
     else if(map.obj==='ruin'){o=new THREE.Mesh(new THREE.BoxGeometry(2,1.5,2),new THREE.MeshLambertMaterial({color:0x78716c}));o.position.y=0.75;o.rotation.y=Math.random();}
     else if(map.obj==='cake'){o=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0xf472b6}));o.position.y=0.5;}
     else if(map.obj==='macaron'){o=new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.5,16),new THREE.MeshLambertMaterial({color:0xec4899}));o.position.y=0.25;}
     if(o){o.position.x=x;o.position.z=z;scene.add(o);objs.push(o);}
   }
   // 敵人 5個，級數 = 技術
   let skills=['新手','普通','高手','大師'];for(let i=0;i<5;i++){let r=Math.random();let skill=r<0.1?'新手':r<0.6?'普通':r<0.9?'高手':'大師';let hp=skill==='新手'?50:skill==='普通'?80:skill==='高手'?120:150;let speed=skill==='新手'?0.02:skill==='普通'?0.04:skill==='高手'?0.06:0.08;let e=makeChar(skill+'敵'+(i+1),['#ef4444','#22c55e','#8b5cf6'][i%3],'#f97316',false);e.position.set(-15+Math.random()*30,0,-15+Math.random()*30);scene.add(e);enemies.push({group:e,hp,maxHp:hp,skill,speed,lastShot:0});}
   document.getElementById('rMap').textContent=MAPS[mapIdx].name;document.getElementById('hMap2').textContent=MAPS[mapIdx].name;
 }
 // 玩家
 playerGroup=makeChar(S.name,S.shirt,S.pants,true);playerGroup.position.set(player.x||0,0,player.z||8);scene.add(playerGroup);
}
function init3D(){
 let view=document.getElementById('view');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(70,view.clientWidth/view.clientHeight,0.1,200);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(view.clientWidth,view.clientHeight);view.appendChild(renderer.domElement);
 // 拖動右邊畫面轉鏡頭睇四周
 let dragging=false,lx=0,ly=0;
 renderer.domElement.addEventListener('touchstart',e=>{dragging=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;});
 renderer.domElement.addEventListener('touchmove',e=>{if(!dragging)return;let t=e.touches[0];yaw-=(t.clientX-lx)*0.005;pitch=Math.max(-0.5,Math.min(0.8,pitch-(t.clientY-ly)*0.005));lx=t.clientX;ly=t.clientY;e.preventDefault();},{passive:false});
 renderer.domElement.addEventListener('touchend',()=>dragging=false);
 renderer.domElement.addEventListener('mousedown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
 renderer.domElement.addEventListener('mousemove',e=>{if(!dragging)return;yaw-=(e.clientX-lx)*0.005;pitch=Math.max(-0.5,Math.min(0.8,pitch-(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;});
 renderer.domElement.addEventListener('mouseup',()=>dragging=false);
 buildWorld();updateWeaponBar();animate();
}
function animate(){
 requestAnimationFrame(animate);
 // 搖桿移動 - 相對鏡頭方向
 let speed=0.12;let moveX=joyX,moveY=joyY;
 if(moveX||moveY){
   let sin=Math.sin(yaw),cos=Math.cos(yaw);
   let dx=(moveX*cos - moveY*sin)*speed, dz=(moveX*sin + moveY*cos)*speed;
   player.x+=dx;player.z+=dz;player.x=Math.max(-19,Math.min(19,player.x));player.z=Math.max(-19,Math.min(19,player.z));
   playerGroup.position.set(player.x,player.y||0,player.z);
   playerGroup.rotation.y=Math.atan2(dx,dz);
   // 行路動畫：腳擺動
   playerGroup.userData.walk+=0.3;let w=playerGroup.userData.walk;playerGroup.userData.legL.rotation.x=Math.sin(w)*0.6;playerGroup.userData.legR.rotation.x=-Math.sin(w)*0.6;playerGroup.userData.armL.rotation.x=-Math.sin(w)*0.5;playerGroup.userData.armR.rotation.x=Math.sin(w)*0.5;
 } else {
   playerGroup.userData.legL.rotation.x*=0.9;playerGroup.userData.legR.rotation.x*=0.9;
 }
 // 跳
 if(!player.onGround){player.vy-=0.02;player.y=(player.y||0)+player.vy;if(player.y<=0){player.y=0;player.onGround=true;}}
 playerGroup.position.y=player.y||0;
 // 鏡頭跟住玩家後面 - 第三人稱
 let camDist=6;let camX=player.x - Math.sin(yaw)*Math.cos(pitch)*camDist;let camZ=player.z - Math.cos(yaw)*Math.cos(pitch)*camDist;let camY=player.y+2+Math.sin(pitch)*camDist+2;
 camera.position.set(camX,camY,camZ);camera.lookAt(player.x,player.y+1.5,player.z);
 // 大廳機械人行嚟行去
 if(mode==='lobby'){enemies.forEach(e=>{e.dir+= (Math.random()-0.5)*0.05;e.group.position.x+=Math.sin(e.dir)*e.speed*10;e.group.position.z+=Math.cos(e.dir)*e.speed*10;e.group.position.x=Math.max(-18,Math.min(18,e.group.position.x));e.group.position.z=Math.max(-18,Math.min(18,e.group.position.z));e.group.rotation.y=e.dir;});
   // 企喺粉紅圈 3秒開始
   let dist=Math.hypot(player.x-0,player.z-(-6));if(dist<2.5){inCircle+=1/60;if(inCircle>=3){inCircle=0;toggleMode();}}else inCircle=0;
   if(inCircle>0)showMsg(`⏳ 企喺度 ${Math.ceil(3-inCircle)} 秒就開波...`);
 } else {
   // 戰鬥敵人 AI
   battleTime+=1/60;document.getElementById('hTime').textContent=Math.max(0,Math.floor(120-battleTime))+'s';
   enemies.forEach(e=>{if(e.hp<=0)return;let dx=player.x-e.group.position.x,dz=player.z-e.group.position.z;let dist=Math.hypot(dx,dz);if(dist>3){e.group.position.x+=dx/dist*e.speed*3;e.group.position.z+=dz/dist*e.speed*3;e.group.rotation.y=Math.atan2(dx,dz);e.group.userData.walk+=0.2;e.group.userData.legL.rotation.x=Math.sin(e.group.userData.walk)*0.6;e.group.userData.legR.rotation.x=-Math.sin(e.group.userData.walk)*0.6;}
     if(dist<12&&Date.now()-e.lastShot>1800){e.lastShot=Date.now();let dmg=e.skill==='新手'?5:e.skill==='普通'?10:e.skill==='高手'?15:20;player.hp-=dmg;document.getElementById('hHp').textContent=Math.max(0,player.hp);showMsg(`💥 ${e.skill}敵人打中你 -${dmg}hp`);if(player.hp<=0)endBattle(false);}});
   if(battleTime>=120||enemies.every(e=>e.hp<=0))endBattle(enemies.every(e=>e.hp<=0));
 }
 // 子彈
 bullets.forEach(b=>{b.mesh.position.x+=b.vx;b.mesh.position.z+=b.vz;enemies.forEach(e=>{if(e.hp>0&&Math.hypot(b.mesh.position.x-e.group.position.x,b.mesh.position.z-e.group.position.z)<1){let w=WEAPONS[S.curWeapon];let dmg=w.dmg;let isHead=Math.random()<0.2;if(isHead){dmg*=2;S.headshot++;}e.hp-=dmg;S.totalDmg+=dmg;b.mesh.position.y=-10;if(e.hp<=0){battleKills++;document.getElementById('hKill').textContent=battleKills;e.group.position.y=-10;showMsg(`🎯 擊殺！${e.skill}敵人倒下！`);}}});});
 renderer.render(scene,camera);
}
function toggleMode(){if(mode==='lobby'){mode='battle';mapIdx=Math.floor(Math.random()*MAPS.length);player={x:0,z:15,hp:100,vy:0,onGround:true,y:0};battleTime=0;battleKills=0;document.getElementById('hKill').textContent='0';document.getElementById('hHp').textContent='100';buildWorld();showMsg(`⚔️ 開始！地圖：${MAPS[mapIdx].name} - 第三人稱，跑嚟跑去打！`);}else{mode='lobby';player={x:0,z:8,hp:100,vy:0,onGround:true,y:0};buildWorld();showMsg('🏠 返到大廳');}}
function shoot(){let w=WEAPONS[S.curWeapon];if(mode!=='battle')return showMsg('🎯 測試場 / 大廳唔可以射，要去戰鬥先得！去粉紅圈企 3秒！');if(w.type==='近戰'){let nearest=null,nd=999;enemies.forEach(e=>{let d=Math.hypot(e.group.position.x-player.x,e.group.position.z-player.z);if(d<nd){nd=d;nearest=e;}});if(nearest&&nd<2){let dmg=w.dmg;if(w.name==='刺客刀')dmg=Math.max(1,10-nd);if(w.name==='偷血刀'){player.hp=Math.min(100,player.hp+5);document.getElementById('hHp').textContent=player.hp;showMsg('🩸 偷血 +5hp');}nearest.hp-=dmg;S.totalDmg+=dmg;if(nearest.hp<=0){battleKills++;nearest.group.position.y=-10;showMsg('⚔️ 近戰擊殺！');}}else showMsg('太遠，行近啲！');return;}
 let dir=new THREE.Vector3(0,0,-1);dir.applyQuaternion(camera.quaternion);let bMesh=new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8),new THREE.MeshBasicMaterial({color:0xfacc15}));bMesh.position.set(player.x,1.2,player.z);scene.add(bMesh);bullets.push({mesh:bMesh,vx:dir.x*0.5,vz:dir.z*0.5});showMsg(`🔫 ${w.name} 發射！`);}
function jump(){if(player.onGround){player.vy=0.25;player.onGround=false;}}
function endBattle(win){if(mode!=='battle')return;S.battles++;if(win){S.win++;S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);let expGain=50+battleKills*10;let macGain=20+battleKills*10;S.exp+=expGain;S.mac+=macGain;if(S.exp>=100){S.level++;S.exp-=100;showMsg(`🎉 升級 Lv.${S.level}！`);}showMsg(`🏆 勝利！+${expGain}經驗 +${macGain}馬卡龍幣 連勝 ${S.streak}`);}else{S.lose++;S.streak=0;S.exp+=10;showMsg('💀 落敗 +10經驗');}save();mode='lobby';player={x:0,z:8,hp:100,vy:0,onGround:true,y:0};buildWorld();}
function updateWeaponBar(){let bar=document.getElementById('weaponBar');bar.innerHTML=S.weapons.map(k=>`<button class="wBtn ${S.curWeapon===k?'sel':''}" onclick="S.curWeapon='${k}';save();updateWeaponBar();document.getElementById('hWeapon').textContent=WEAPONS['${k}'].name;document.getElementById('hAmmo').textContent=WEAPONS['${k}'].ammo">${WEAPONS[k].icon} ${WEAPONS[k].name}</button>`).join('');document.getElementById('hWeapon').textContent=WEAPONS[S.curWeapon].name;document.getElementById('hAmmo').textContent=WEAPONS[S.curWeapon].ammo;}
function tabBottom(type,btn){document.querySelectorAll('.bBtn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');let t=document.getElementById('mTitle'),b=document.getElementById('mBody');document.getElementById('modal').classList.add('show');
 if(type==='bag'){t.textContent='🎒 背包';b.innerHTML=S.inventory.length?S.inventory.map(it=>`<div class="mBtn">📦 ${it}</div>`).join(''):'<p>背包空，去商店買盲盒！</p>';}
 if(type==='weapon'){t.textContent='🔫 武器';let html='';Object.keys(WEAPONS).forEach(k=>{let w=WEAPONS[k];let owned=S.weapons.includes(k);html+=`<div class="mBtn ${S.curWeapon===k?'sel':''}"><b>${w.icon} ${w.name}</b> ${w.type} | 傷害 ${w.dmg} | 彈藥 ${w.ammo} | CD ${w.cd}s<br>價格: ${w.price===0?'免費':w.price+'馬卡龍'} <button onclick="buyWeapon('${k}')" style="float:right;background:#ec4899;color:#fff;border:none;padding:4px 10px;border-radius:99px">${owned?(S.curWeapon===k?'使用中':'使用'):'購買'}</button></div>`;});b.innerHTML=html;}
 if(type==='char'){t.textContent='🟨 角色 - 換衫褲顏色 (20馬卡龍)';b.innerHTML=`<p>而家：上衣 ${S.shirt} | 褲 ${S.pants}</p>`+['#3b82f6','#ef4444','#22c55e','#facc15','#ec4899','#8b5cf6'].map(c=>`<button class="mBtn" onclick="changeShirt('${c}')">👕 上衣變 ${c}</button>`).join('')+['#f97316','#3b82f6','#22c55e','#000000'].map(c=>`<button class="mBtn" onclick="changePants('${c}')">👖 褲變 ${c}</button>`).join('');}
 if(type==='shop'){t.textContent='🛒 商店';b.innerHTML=`<div class="mBtn"><b>📦 武器皮膚盒 (隨機)</b><br>普通50% 稀有30% 史詩15% 傳說5%<br><button onclick="buyBox('weapon')" style="background:#ec4899;color:#fff;border:none;padding:6px 12px;border-radius:99px">30馬卡龍買</button></div><div class="mBtn"><b>📦 武器皮膚盒 (史詩以上)</b><br>史詩60% 傳說30% 神話10%<br><button onclick="buyBox('epic')" style="background:#22c55e;color:#fff;border:none;padding:6px 12px;border-radius:99px">5綠寶石買</button></div><div class="mBtn"><b>🎁 大禮包</b><br>10綠寶石：5盲盒 +100馬卡龍 +傳說皮膚<br><button onclick="buyBig()" style="background:#f59e0b;color:#fff;border:none;padding:6px 12px;border-radius:99px">10綠寶石買</button></div><div class="mBtn"><b>🎫 通行證</b><br>20綠寶石：每日 +50馬卡龍<br><button onclick="buyPass()" style="background:#8b5cf6;color:#fff;border:none;padding:6px 12px;border-radius:99px">20綠寶石買</button></div>`;}
 if(type==='other'){t.textContent='⋯ 其他';b.innerHTML=`<button class="mBtn" onclick="showStats()">📊 數據</button><button class="mBtn" onclick="showRank()">🏆 排行榜 (只顯示真人)</button><button class="mBtn" onclick="showFriends()">👥 好友</button><button class="mBtn" onclick="showAch()">🏅 成就</button>`;}
}
function buyWeapon(k){if(S.weapons.includes(k)){S.curWeapon=k;save();updateWeaponBar();showMsg(`✅ 已使用 ${WEAPONS[k].name}`);}else{let w=WEAPONS[k];if(S.mac>=w.price){S.mac-=w.price;S.weapons.push(k);S.curWeapon=k;save();updateWeaponBar();showMsg(`🎉 買咗 ${w.name}！`);}else showMsg('馬卡龍幣唔夠！');}closeModal();}
function changeShirt(c){if(S.mac>=20){S.mac-=20;S.shirt=c;save();buildWorld();showMsg('👕 換衫成功！你個角色即刻變色！');}else showMsg('唔夠！');}
function changePants(c){if(S.mac>=20){S.mac-=20;S.pants=c;save();buildWorld();showMsg('👖 換褲成功！');}else showMsg('唔夠！');}
function buyBox(t){if(t==='weapon'){if(S.mac<30)return showMsg('唔夠！');S.mac-=30;S.inventory.push('武器皮膚盒');}else{if(S.gem<5)return showMsg('唔夠！');S.gem-=5;S.inventory.push('史詩皮膚盒');}save();showMsg('📦 買咗盲盒，去背包開！');closeModal();}
function buyBig(){if(S.gem<10)return showMsg('唔夠！');S.gem-=10;S.mac+=100;save();showMsg('🎁 大禮包 +100馬卡龍！');closeModal();}
function buyPass(){if(S.gem<20)return showMsg('唔夠！');S.gem-=20;save();showMsg('🎫 通行證已買！');closeModal();}
function showStats(){let t=document.getElementById('mTitle'),b=document.getElementById('mBody');t.textContent='📊 數據';b.innerHTML=`<div class="row"><span>戰鬥場數</span><b>${S.battles}</b></div><div class="row"><span>勝利 / 落敗</span><b>${S.win} / ${S.lose}</b></div><div class="row"><span>勝率</span><b>${S.battles?Math.round(S.win/S.battles*100):0}%</b></div><div class="row"><span>連勝</span><b>${S.streak}</b></div><div class="row"><span>爆頭率</span><b>${S.battles?Math.round(S.headshot/Math.max(1,S.kills)*100):0}%</b></div>`;}
function showRank(){let t=document.getElementById('mTitle'),b=document.getElementById('mBody');t.textContent='🏆 排行榜 - 只顯示真人';let list=[{name:'阿強',level:32},{name:'小美',level:28},{name:'大佬明',level:25},{name:S.name,level:S.level,me:true}].sort((a,b)=>b.level-a.level);b.innerHTML=list.map((p,i)=>`<div class="row"><span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1+'.'} ${p.name} ${p.me?'(你)':''}</span><b>Lv.${p.level}</b></div>`).join('');}
function showFriends(){let t=document.getElementById('mTitle'),b=document.getElementById('mBody');t.textContent='👥 好友';b.innerHTML=`<input id="fn" placeholder="排行榜對方名字"><button class="bigBtn" onclick="addF()">發邀請</button><p style="font-size:12px">唔可以向機械人發邀請！</p>`;}
function addF(){let n=document.getElementById('fn').value.trim();if(['阿強','小美','大佬明'].includes(n))showMsg(`✅ ${n} 同意咗，成為好友！`);else showMsg('❌ 對方唔同意 / 唔係真人');closeModal();}
function showAch(){let t=document.getElementById('mTitle'),b=document.getElementById('mBody');t.textContent='🏅 成就 (10項)';b.innerHTML=`<p>首勝 / 百戰 / 連勝王 / 爆頭王 / 傷害王 / 收藏家 / 富翁 / 大師 / 狙擊手 / 馬卡龍大師<br>每完成升1級，難度提升！</p>`;}
let joy=document.getElementById('joy'),knob=document.getElementById('joyKnob');
joy.addEventListener('touchstart',e=>{let t=e.touches[0];handleJoy(t);});
joy.addEventListener('touchmove',e=>{let t=e.touches[0];handleJoy(t);e.preventDefault();},{passive:false});
joy.addEventListener('touchend',()=>{joyX=0;joyY=0;knob.style.left='28px';knob.style.top='28px';});
function handleJoy(t){let r=joy.getBoundingClientRect();let x=(t.clientX-r.left-50)/50,y=(t.clientY-r.top-50)/50;joyX=Math.max(-1,Math.min(1,x));joyY=Math.max(-1,Math.min(1,y));knob.style.left=(28+joyX*20)+'px';knob.style.top=(28+joyY*20)+'px';}
addEventListener('resize',()=>{if(renderer){let v=document.getElementById('view');renderer.setSize(v.clientWidth,v.clientHeight);camera.aspect=v.clientWidth/v.clientHeight;camera.updateProjectionMatrix();}});
if(ACC&&ACC.auto&&S){setTimeout(()=>doLogin(),300);}
</script></body></html>
